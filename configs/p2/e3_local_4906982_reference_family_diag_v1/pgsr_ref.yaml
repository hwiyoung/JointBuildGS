blocking_differences:
  - PGSR optimizes 3D Gaussians and derives a plane from the minimum scale axis; the current model is an intrinsically planar 2D Gaussian.
  - PGSR requires its plane-depth rasterizer output and rendered plane distance; gsplat rasterization_2dgs does not expose those tensors.
  - PGSR requires source-view reprojection, occlusion filtering, patch LNCC, abs-gradient densification, and observation-count trimming as one coupled method.
  - Reusing the current MVC and normal-consistency losses would be a new hybrid, not a PGSR reference arm.
next_required_work: A separately reviewed gsplat-native PGSR port and synthetic forward/backward parity suite.
