# Phase 1 Step 1-6 — MatrixCity + L_mutual + L_structure (Both, ablation final)
# L_mutual warmup 10000, L_structure warmup 20000 (기하-의미 수렴 후 그룹 안정화)
seed: 0
device: cuda

data_root: /workspace/JointBuildGS/data/matrixcity
out_dir: /workspace/JointBuildGS/results/phase1_ablation/run

downscale: 1.0
sh_degree: 3
sh_up_every: 1000

load_depth: true
load_normal: true
load_semantic: true
depth_scale: 0.0000944285

# All Step 1-3 losses
w_photo: 1.0
w_depth: 0.5
w_normal: 0.05
w_nc: 0.05
w_distort: 0.0
w_sem: 0.1
photo_lam: 0.2

# L_mutual (Mechanism 1)
w_mutual: 0.1
mutual_warmup: 10000
mutual_tau: 0.15
mutual_height_th: 0.15
mutual_mode: full
gravity_file: /workspace/JointBuildGS/data/matrixcity/gravity.json

# L_structure (Mechanism 2)
w_structure: 0.1
w_structure_na: 1.0
w_structure_cp: 1.0
structure_warmup: 20000
structure_regroup_every: 500
structure_voxel_size: 0.05
structure_n_directions: 12
structure_min_group: 5

lr_means: 1.6e-4
lr_scales: 5.0e-3
lr_quats: 1.0e-3
lr_opacities: 5.0e-2
lr_sh0: 2.5e-3
lr_shN: 1.25e-4
lr_sem: 2.5e-3

prune_opa: 0.005
grow_grad2d: 5.0e-4
grow_scale3d: 0.01
prune_scale3d: 0.1
refine_start_iter: 500
refine_stop_iter: 10000
refine_every: 100
reset_every: 3000

max_iter: 30000
eval_every: 2000
ckpt_every: 5000
