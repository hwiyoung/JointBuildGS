# P2 make-or-break v6 — GS arm: SPARSE seed (= default COLMAP points3D init, ~372k).
# Joint optimisation: L_sem detach RELEASED (sem_detach_geometry=false) + L_structure (inter).
# w_mutual dropped. MVS depth/normal supervision ablated (w_depth=w_normal=0). clean (geoidfix) labels.
# Only difference vs gs_seed_{dense,acmp}: init point cloud (here = native SfM sparse; no init_pointcloud).
seed: 0
device: cuda

data_root: /workspace/JointBuildGS/results/tum_transfer/data_geoidfix   # clean geoid-corrected labels

downscale: 1.0
sh_degree: 3
sh_up_every: 1000

w_photo: 1.0
w_depth: 0.0
w_normal: 0.0
w_nc: 0.05
w_distort: 0.0
photo_lam: 0.2

load_semantic: true
w_sem: 0.1
sem_detach_geometry: false   # joint-opt: L_sem gradient flows into geometry (means/quats/scales/opacity)

w_mutual: 0.0                 # dropped for v6

w_structure: 0.1             # inter-primitive structure alignment
w_structure_na: 1.0
w_structure_cp: 1.0
structure_voxel_size: 2.0
structure_warmup: 15000
structure_regroup_every: 500

lr_means: 1.6e-4
lr_scales: 5.0e-3
lr_quats: 1.0e-3
lr_opacities: 5.0e-2
lr_sh0: 2.5e-3
lr_shN: 1.25e-4
lr_sem: 2.5e-3

# densification: default (sparse init must grow)
prune_opa: 0.005
grow_grad2d: 5.0e-4
grow_scale3d: 0.01
prune_scale3d: 0.1
refine_start_iter: 500
refine_stop_iter: 25000
refine_every: 100
reset_every: 3000

max_iter: 30000
eval_every: 2000
ckpt_every: 10000
out_dir: /workspace/JointBuildGS/results/tum_transfer/mob/gs_seed_sparse
