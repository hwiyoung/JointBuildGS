# P2 Phase B / B1 — self-supervised multi-view consistency (L_mvc), DENSE seed arm.
# Base = gs_d4_dense.yaml (the reported D4 loss balance). ISOLATION: this file is BYTE-IDENTICAL
# to gs_d4_dense.yaml EXCEPT (1) the added `w_mvc` + `mvc_*` block below and (2) out_dir. Every
# other loss/schedule/densification value is held at D4 so any delta vs gs_d4_dense is attributable
# to the multi-view consistency term ALONE (task: "이 항만 격리"). cp stays at 0.01 (NOT zeroed).
# L_mvc = PGSR/ULSR-style: reproject src rendered depth into a covisible neighbour, penalize
# depth+normal disagreement (occlusion-filtered). NO GT labels. Engine change = additive only.
# Report: docs/experiments/w_phase_b_structure/reports/W_phaseB_structure.md. branch feat/p2-structure-learn.
seed: 0
device: cuda

data_root: /workspace/JointBuildGS/results/tum_transfer/data_geoidfix   # MUST-EQ

init_pointcloud: /workspace/JointBuildGS/results/tum_transfer/mob_analysis/seed/seed_dense.ply   # MUST-EQ
init_pointcloud_mode: concat
seed_protect: true                                                       # MUST-EQ
seed_log_footprints: /workspace/JointBuildGS/results/tum_transfer/analysis/footprints_aoi.geojson
seed_log_buildings:
  - DEBY_LOD2_42364609
  - DEBY_LOD2_42364659
  - DEBY_LOD2_42364663
  - DEBY_LOD2_4907182
  - DEBY_LOD2_4907510
  - DEBY_LOD2_4908050
  - DEBY_LOD2_4908166
  - DEBY_LOD2_4908176
  - DEBY_LOD2_4906969
  - DEBY_LOD2_4908023
  - DEBY_LOD2_4906972

downscale: 1.0
sh_degree: 3
sh_up_every: 1000

# === D4 loss-balance — MUST-EQ to gs_d4_dense.yaml (held fixed; only L_mvc is added) ===
w_photo: 1.0

w_depth: 0.03
w_normal: 0.0
load_depth: true
load_normal: true
depth_scale: 1.0
depth_warmup: 5000
depth_schedule: ramp
depth_ramp_steps: 5000
normal_warmup: 5000
normal_schedule: ramp
normal_ramp_steps: 5000

w_nc: 0.05
w_distort: 0.0
photo_lam: 0.2

load_semantic: true
w_sem: 0.1
sem_detach_geometry: false   # MUST-EQ

w_mutual: 0.0

w_structure: 1.0      # MUST-EQ (cp/na carrier)
w_structure_na: 0.08  # MUST-EQ
w_structure_cp: 0.01  # MUST-EQ — cp kept at D4 value (NOT zeroed; isolate L_mvc only)
structure_grouping: g2
structure_voxel_size: 2.0
structure_merge_n_cos: 0.92
structure_merge_d_tol: 0.5
structure_min_group: 30
structure_warmup: 15000
structure_regroup_every: 1000

# === B1 NEW: self-supervised multi-view geometric consistency (the ONLY addition vs D4) ===
w_mvc: 0.5            # effective scalar on L_mvc total (depth_consistency + 0.5*normal_consistency)
mvc_warmup: 7000     # fire after photometric base + depth prior settle, before densification stop (20k)
mvc_schedule: ramp   # ramp in gently to avoid shocking the settled geometry
mvc_ramp_steps: 5000 # fully on by ~12k -> active through densification (->20k) and structure (15k+) windows
mvc_every: 1         # render the neighbour every iter (ref under no_grad = cheap; cleanest signal)
mvc_neighbor_k: 2    # covisible neighbours per view (random pick among them each fire)
mvc_max_angle_deg: 40.0   # viewing-direction gate (see roughly the same surface)
mvc_min_baseline: 2.0     # GS-local metres — parallax floor so depth disagreement is informative
mvc_w_normal: 0.5    # weight of the normal-consistency sub-term (= legacy ULSR-GS default)
mvc_rel_thresh: 0.1  # occlusion inlier: relative depth error must be < 10% to be penalized
mvc_ref_detach: true # render reference view under no_grad (one-sided gradient, legacy behaviour)

lr_means: 1.6e-4
lr_scales: 5.0e-3
lr_quats: 1.0e-3
lr_opacities: 5.0e-2
lr_sh0: 2.5e-3
lr_shN: 1.25e-4
lr_sem: 2.5e-3

prune_opa: 0.005
grow_grad2d: 1.0e-3
grow_scale3d: 0.01
prune_scale3d: 0.1
refine_start_iter: 500
refine_stop_iter: 20000
refine_every: 200
reset_every: 3000

max_iter: 30000                 # MUST-EQ
eval_every: 2000
ckpt_every: 10000
out_dir: /workspace/JointBuildGS/results/tum_transfer/mob/gs_b1_dense
