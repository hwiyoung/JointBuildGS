# P2 implementation ① SEMANTIC SEEDING. Vanilla base (sem/mutual/structure OFF) +
# carve seeds for the 8 textureless "recovery" buildings, concatenated onto the SfM
# init cloud before the model is built. Scope = init only (do seeds get created?);
# depth precision / training survival are step ②.
seed: 0
device: cuda

data_root: /workspace/JointBuildGS/results/tum_transfer/data

downscale: 1.0
sh_degree: 3
sh_up_every: 1000

w_photo: 1.0
w_depth: 0.0
w_normal: 0.0
w_nc: 0.05
w_distort: 0.0
photo_lam: 0.2

lr_means: 1.6e-4
lr_scales: 5.0e-3
lr_quats: 1.0e-3
lr_opacities: 5.0e-2
lr_sh0: 2.5e-3
lr_shN: 1.25e-4
lr_sem: 2.5e-3

prune_opa: 0.005
grow_grad2d: 5.0e-4
grow_scale3d: 0.01
prune_scale3d: 0.1
refine_start_iter: 500
refine_stop_iter: 25000
refine_every: 100
reset_every: 3000

max_iter: 30000
eval_every: 2000
ckpt_every: 10000
load_semantic: false

out_dir: /workspace/JointBuildGS/results/tum_transfer/mob/seed_semantic

# ---- semantic seeding (P2 ①) ----
# Frame: GS-LOCAL = EPSG:25832 - world_offset (ellipsoidal). footprint xy -> local by
# subtracting world_offset[:2]; z taken directly in the GS-local band. The geoid (~48 m)
# is already baked into the geoid-fixed labels (rendered with shift_z = 604-48 = 556) and
# into the band: z_local = Hoehe_orthometric + geoid - 604. Band [-55, 5] reproduces
# er3_diag.json exactly. The geoid raster path is provenance only (labels encode it).
seed_semantic: true
seed_cfg:                          # NB: NOT `seed:` — that is the RNG seed (top of file)
  footprints:   /workspace/JointBuildGS/results/tum_transfer/analysis/footprints_aoi.geojson
  id_field:     building_id
  semantic_dir: /workspace/JointBuildGS/results/tum_transfer/clean_labels_geoidfix/semantic
  world_offset: [690953.0, 5336071.0, 604.0]
  geoid:        /workspace/JointBuildGS/phases/p0-audit/data/raw/geoid/de_bkg_gcg2016.tif
  z_min: -55.0
  z_max: 5.0
  voxel: 1.0
  tau: 0.6
  min_obs: 5
  roof_code: 1
  wall_code: 2
  max_seeds_per_building: 0        # 0 = keep one seed per occupied voxel (no cap)
  buildings:
    - DEBY_LOD2_42364609
    - DEBY_LOD2_42364659
    - DEBY_LOD2_42364663
    - DEBY_LOD2_4907182
    - DEBY_LOD2_4907510
    - DEBY_LOD2_4908050
    - DEBY_LOD2_4908166
    - DEBY_LOD2_4908176
