# P2 implementation ② "DEPTH COUPLING" — condition B (oracle-ceiling, comparison only).
# Release L_sem geometry detach (sem_detach_geometry=false) so semantics moves geometry, and
# seed the 8 textureless buildings over a per-building ORACLE band [true roof - 1, roof + 1]
# (true roof height from reference; B = ceiling, never used by A). Pure ② = no mutual, no structure.
# L_sem labels = geoid-corrected (data_root -> data_geoidfix/semantic). Seeds carved from same labels.
seed: 0
device: cuda

data_root: /workspace/JointBuildGS/results/tum_transfer/data_geoidfix   # corrected (geoidfix) semantic labels

downscale: 1.0
sh_degree: 3
sh_up_every: 1000

w_photo: 1.0
w_depth: 0.0
w_normal: 0.0
w_nc: 0.05
w_distort: 0.0
photo_lam: 0.2

load_semantic: true
w_sem: 0.1
sem_detach_geometry: false   # ② : L_sem gradient flows into geometry (means/quats/scales/opacity)
w_mutual: 0.0
w_structure: 0.0             # pure ② (no mechanism-1/2)

lr_means: 1.6e-4
lr_scales: 5.0e-3
lr_quats: 1.0e-3
lr_opacities: 5.0e-2
lr_sh0: 2.5e-3
lr_shN: 1.25e-4
lr_sem: 2.5e-3

prune_opa: 0.005
grow_grad2d: 5.0e-4
grow_scale3d: 0.01
prune_scale3d: 0.1
refine_start_iter: 500
refine_stop_iter: 25000
refine_every: 100
reset_every: 3000

max_iter: 30000
eval_every: 2000
ckpt_every: 10000

out_dir: /workspace/JointBuildGS/results/tum_transfer/mob/depth_release_oracle

# ---- semantic seeding (P2 ②): per-building ORACLE band [roof-1, roof+1] (reference roof) ----
seed_semantic: true
seed_cfg:
  footprints:   /workspace/JointBuildGS/results/tum_transfer/analysis/footprints_aoi.geojson
  id_field:     building_id
  semantic_dir: /workspace/JointBuildGS/results/tum_transfer/clean_labels_geoidfix/semantic
  world_offset: [690953.0, 5336071.0, 604.0]
  geoid:        /workspace/JointBuildGS/phases/p0-audit/data/raw/geoid/de_bkg_gcg2016.tif
  bands_file:   /workspace/JointBuildGS/results/tum_transfer/mob_analysis/seed_bands_oracle.json
  z_min: -55.0      # fallback only; bands_file overrides per building
  z_max: 5.0
  voxel: 1.0
  tau: 0.6
  min_obs: 5
  roof_code: 1
  wall_code: 2
  max_seeds_per_building: 0
  buildings:
    - DEBY_LOD2_42364609
    - DEBY_LOD2_42364659
    - DEBY_LOD2_42364663
    - DEBY_LOD2_4907182
    - DEBY_LOD2_4907510
    - DEBY_LOD2_4908050
    - DEBY_LOD2_4908166
    - DEBY_LOD2_4908176
