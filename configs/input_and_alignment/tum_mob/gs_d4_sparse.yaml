# P2-D4 (CORRECTED) — sparse seed arm for E5 preregistration.
# Derived from gs_d4_dense.yaml. Recipe terms are identical; init seed is the
# native COLMAP sparse points3D cloud. out_dir is separated only to avoid
# overwriting dense outputs.
seed: 0
device: cuda

data_root: /workspace/JointBuildGS/results/tum_transfer/data_geoidfix   # MUST-EQ

init_pointcloud: /workspace/JointBuildGS/results/tum_transfer/mob_analysis/seed/seed_sparse.ply   # MUST-EQ
init_pointcloud_mode: concat
seed_protect: true                                                       # MUST-EQ
seed_log_footprints: /workspace/JointBuildGS/results/tum_transfer/analysis/footprints_aoi.geojson
seed_log_buildings:
  - DEBY_LOD2_42364609
  - DEBY_LOD2_42364659
  - DEBY_LOD2_42364663
  - DEBY_LOD2_4907182
  - DEBY_LOD2_4907510
  - DEBY_LOD2_4908050
  - DEBY_LOD2_4908166
  - DEBY_LOD2_4908176
  - DEBY_LOD2_4906969
  - DEBY_LOD2_4908023
  - DEBY_LOD2_4906972

downscale: 1.0
sh_degree: 3
sh_up_every: 1000

# === D4 (corrected) loss-balance: D-healthy terms kept, only cp/depth/normal fixed ===
w_photo: 1.0          # = D (kept; NOT 5.6)

# --- Lever 1: depth/normal supervision (MVS maps under data_root/stereo) ---
w_depth: 0.03         # D4: 0.1 -> 0.03  (de-noise: CV 1.74 noisy target -> lower pin; valid-mask kept)
w_normal: 0.0         # D4: 0.15 -> 0    external MVS normal removed (noise + depth's noise partner)
load_depth: true
load_normal: true     # maps still loaded (pipeline identical to D); weight 0 -> zero gradient, TB still logs loss_n
depth_scale: 1.0
# MUST-EQ schedule: base (photo+sem) settles 5k, depth ramps 5k->10k (normal ramp moot at w=0)
depth_warmup: 5000
depth_schedule: ramp
depth_ramp_steps: 5000
normal_warmup: 5000
normal_schedule: ramp
normal_ramp_steps: 5000

w_nc: 0.05            # = D (kept; NOT 2.1 — over-constraint was the photo-lag culprit)
w_distort: 0.0
photo_lam: 0.2        # MUST-EQ

load_semantic: true
w_sem: 0.1            # = D (kept; NOT 0.92)
sem_detach_geometry: false   # MUST-EQ

w_mutual: 0.0

# --- Lever 2: structure reinforcement (surface-level G2) ---
# w_structure=1.0 so sub-weights ARE the effective scalars.
w_structure: 1.0      # D4: 0.08 -> 1.0  (carrier; effective set by sub-weights below)
w_structure_na: 0.08  # effective na = 1.0*0.08 = 0.08  (= D's effective na, kept)
w_structure_cp: 0.01  # effective cp = 1.0*0.01 = 0.01  (de-dominate: cp 68% -> ~31%, to photo parity)
structure_grouping: g2          # MUST-EQ (G2 current)
structure_voxel_size: 2.0       # MUST-EQ
structure_merge_n_cos: 0.92     # MUST-EQ
structure_merge_d_tol: 0.5      # MUST-EQ
structure_min_group: 30         # MUST-EQ
structure_warmup: 15000         # MUST-EQ (structure gate @15000)
structure_regroup_every: 1000   # MUST-EQ

lr_means: 1.6e-4
lr_scales: 5.0e-3
lr_quats: 1.0e-3
lr_opacities: 5.0e-2
lr_sh0: 2.5e-3
lr_shN: 1.25e-4
lr_sem: 2.5e-3

# densification: D dense settings — MUST-EQ (only seed-prune disabled via seed_protect)
prune_opa: 0.005
grow_grad2d: 1.0e-3
grow_scale3d: 0.01
prune_scale3d: 0.1
refine_start_iter: 500
refine_stop_iter: 20000
refine_every: 200
reset_every: 3000

max_iter: 30000                 # MUST-EQ
eval_every: 2000
ckpt_every: 10000
out_dir: /workspace/JointBuildGS/results/tum_transfer/mob/gs_d4_sparse
