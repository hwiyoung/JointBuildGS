# P2-D 전체 prior 수트 — ACMP seed + all three priors ON (vs v6 gs_seed_acmp_protect).
# Copy of gs_seed_acmp_protect.yaml. MUST-EQ kept IDENTICAL: data_root, sem_detach_geometry=false,
# w_sem 0.1, w_nc 0.05, max_iter 30000, densification (v6 dense), init_pointcloud + seed_protect.
# CHANGED (the only deltas vs v6) — three levers turned ON (see gs_prior_full_dense.yaml header).
# Only difference from gs_prior_full_dense.yaml: init seed = seed_acmp.ply, out_dir = ..._acmp.
seed: 0
device: cuda

data_root: /workspace/JointBuildGS/results/tum_transfer/data_geoidfix

init_pointcloud: /workspace/JointBuildGS/results/tum_transfer/mob_analysis/seed/seed_acmp.ply
init_pointcloud_mode: concat
seed_protect: true
seed_log_footprints: /workspace/JointBuildGS/results/tum_transfer/analysis/footprints_aoi.geojson
seed_log_buildings:
  - DEBY_LOD2_42364609
  - DEBY_LOD2_42364659
  - DEBY_LOD2_42364663
  - DEBY_LOD2_4907182
  - DEBY_LOD2_4907510
  - DEBY_LOD2_4908050
  - DEBY_LOD2_4908166
  - DEBY_LOD2_4908176
  - DEBY_LOD2_4906969
  - DEBY_LOD2_4908023
  - DEBY_LOD2_4906972

downscale: 1.0
sh_degree: 3
sh_up_every: 1000

w_photo: 1.0

# --- Lever 1: depth/normal supervision (MVS maps under data_root/stereo) ---
w_depth: 0.1
w_normal: 0.15        # Phase-2 rebalance: raised 0.05->0.15 (was negligible at 0.05×0.25≈0.01)
load_depth: true
load_normal: true
depth_scale: 1.0
depth_warmup: 5000
depth_schedule: ramp
depth_ramp_steps: 5000
normal_warmup: 5000
normal_schedule: ramp
normal_ramp_steps: 5000

w_nc: 0.05
w_distort: 0.0
photo_lam: 0.2

load_semantic: true
w_sem: 0.1
sem_detach_geometry: false

w_mutual: 0.0

# --- Lever 2: structure reinforcement (surface-level G2 + raised weight) ---
w_structure: 0.08   # Phase-2 rebalance: lowered 0.3->0.08 (G2 coplanar raw~17 → 0.3 over-planarized, 85% of total)
w_structure_na: 1.0
w_structure_cp: 1.0
structure_grouping: g2
structure_voxel_size: 2.0
structure_merge_n_cos: 0.92
structure_merge_d_tol: 0.5
structure_min_group: 30
structure_warmup: 15000
structure_regroup_every: 1000   # G2 union-find ~46s/regroup → relaxed from v6's 500 to bound overhead

lr_means: 1.6e-4
lr_scales: 5.0e-3
lr_quats: 1.0e-3
lr_opacities: 5.0e-2
lr_sh0: 2.5e-3
lr_shN: 1.25e-4
lr_sem: 2.5e-3

# densification: v6 dense settings — unchanged (only seed-prune disabled via seed_protect)
prune_opa: 0.005
grow_grad2d: 1.0e-3
grow_scale3d: 0.01
prune_scale3d: 0.1
refine_start_iter: 500
refine_stop_iter: 20000
refine_every: 200
reset_every: 3000

max_iter: 30000
eval_every: 2000
ckpt_every: 10000
out_dir: /workspace/JointBuildGS/results/tum_transfer/mob/gs_prior_full_acmp
