# P2-D4 (CORRECTED) PRE-CHECK — gs_d4_dense.yaml IDENTICAL except max_iter=6000 + out_dir=...precheck.
# Re-run after the "normalize cp only" correction. Goal: confirm the photo/psnr lag from the over-applied
# version is GONE (nc back to 0.05, photo back to 1.0) while stability/generation stay clean.
# ② cp-firing NOT observable here (structure gate @15000) -> main-run monitor (§3).
seed: 0
device: cuda

data_root: /workspace/JointBuildGS/results/tum_transfer/data_geoidfix

init_pointcloud: /workspace/JointBuildGS/results/tum_transfer/mob_analysis/seed/seed_dense.ply
init_pointcloud_mode: concat
seed_protect: true
seed_log_footprints: /workspace/JointBuildGS/results/tum_transfer/analysis/footprints_aoi.geojson
seed_log_buildings:
  - DEBY_LOD2_42364609
  - DEBY_LOD2_42364659
  - DEBY_LOD2_42364663
  - DEBY_LOD2_4907182
  - DEBY_LOD2_4907510
  - DEBY_LOD2_4908050
  - DEBY_LOD2_4908166
  - DEBY_LOD2_4908176
  - DEBY_LOD2_4906969
  - DEBY_LOD2_4908023
  - DEBY_LOD2_4906972

downscale: 1.0
sh_degree: 3
sh_up_every: 1000

w_photo: 1.0

w_depth: 0.03
w_normal: 0.0
load_depth: true
load_normal: true
depth_scale: 1.0
depth_warmup: 5000
depth_schedule: ramp
depth_ramp_steps: 5000
normal_warmup: 5000
normal_schedule: ramp
normal_ramp_steps: 5000

w_nc: 0.05
w_distort: 0.0
photo_lam: 0.2

load_semantic: true
w_sem: 0.1
sem_detach_geometry: false

w_mutual: 0.0

w_structure: 1.0
w_structure_na: 0.08
w_structure_cp: 0.01
structure_grouping: g2
structure_voxel_size: 2.0
structure_merge_n_cos: 0.92
structure_merge_d_tol: 0.5
structure_min_group: 30
structure_warmup: 15000
structure_regroup_every: 1000

lr_means: 1.6e-4
lr_scales: 5.0e-3
lr_quats: 1.0e-3
lr_opacities: 5.0e-2
lr_sh0: 2.5e-3
lr_shN: 1.25e-4
lr_sem: 2.5e-3

prune_opa: 0.005
grow_grad2d: 1.0e-3
grow_scale3d: 0.01
prune_scale3d: 0.1
refine_start_iter: 500
refine_stop_iter: 20000
refine_every: 200
reset_every: 3000

max_iter: 6000
eval_every: 2000
ckpt_every: 6000
out_dir: /workspace/JointBuildGS/results/tum_transfer/mob/gs_d4_dense_precheck
