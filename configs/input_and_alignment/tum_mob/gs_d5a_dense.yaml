# P2-D5a — cp ablation: cp OFF. Base = gs_d4_dense.yaml (corrected D4). D5 isolates the planarization
# lever (cp) from the de-noise terms (depth 0.03 / normal 0), which are FIXED = D4. Only w_structure_cp
# (and, for D5c, structure_warmup) varies across the three D5 arms; everything else is MUST-EQ to D4.
#   D5a (this file): w_structure_cp 0.0    (cp OFF; cp share 0%)  · structure_warmup 15000
#   D5b            : w_structure_cp 0.03   (cp HARD; cp share ~57%) · structure_warmup 15000
#   D5c            : w_structure_cp 0.01   (cp EARLY; cp share 31%) · structure_warmup 5000
#   (cp FAIR 0.01 · warmup 15000 = D4 itself — reused, NOT re-trained)
# na (w_structure_na 0.08) is KEPT (D-healthy term); only the coplanar sub-weight is zeroed here.
# Engine UNCHANGED (config-only). Spec/pre-registration: P2_D5_cp_ablation_사양_사전등록_20260626.md.
seed: 0
device: cuda

data_root: /workspace/JointBuildGS/results/tum_transfer/data_geoidfix   # MUST-EQ

init_pointcloud: /workspace/JointBuildGS/results/tum_transfer/mob_analysis/seed/seed_dense.ply   # MUST-EQ
init_pointcloud_mode: concat
seed_protect: true                                                       # MUST-EQ
seed_log_footprints: /workspace/JointBuildGS/results/tum_transfer/analysis/footprints_aoi.geojson
seed_log_buildings:
  - DEBY_LOD2_42364609
  - DEBY_LOD2_42364659
  - DEBY_LOD2_42364663
  - DEBY_LOD2_4907182
  - DEBY_LOD2_4907510
  - DEBY_LOD2_4908050
  - DEBY_LOD2_4908166
  - DEBY_LOD2_4908176
  - DEBY_LOD2_4906969
  - DEBY_LOD2_4908023
  - DEBY_LOD2_4906972

downscale: 1.0
sh_degree: 3
sh_up_every: 1000

# === D5a loss-balance = D4 EXACTLY except w_structure_cp: 0.01 -> 0.0 (cp OFF) ===
w_photo: 1.0          # = D4

w_depth: 0.03         # = D4 (de-noise FIXED)
w_normal: 0.0         # = D4 (external MVS normal removed, FIXED)
load_depth: true
load_normal: true
depth_scale: 1.0
depth_warmup: 5000
depth_schedule: ramp
depth_ramp_steps: 5000
normal_warmup: 5000
normal_schedule: ramp
normal_ramp_steps: 5000

w_nc: 0.05            # = D4
w_distort: 0.0
photo_lam: 0.2        # MUST-EQ

load_semantic: true
w_sem: 0.1            # = D4
sem_detach_geometry: false   # MUST-EQ

w_mutual: 0.0

w_structure: 1.0      # = D4 (carrier; sub-weights ARE the effective scalars)
w_structure_na: 0.08  # = D4 (effective na = 0.08, KEPT)
w_structure_cp: 0.0   # D5a: 0.01 -> 0.0  (cp OFF — ablation: is cp the lever?)
structure_grouping: g2          # MUST-EQ
structure_voxel_size: 2.0       # MUST-EQ
structure_merge_n_cos: 0.92     # MUST-EQ
structure_merge_d_tol: 0.5      # MUST-EQ
structure_min_group: 30         # MUST-EQ
structure_warmup: 15000         # = D4 (cp gate @15000)
structure_regroup_every: 1000   # MUST-EQ

lr_means: 1.6e-4
lr_scales: 5.0e-3
lr_quats: 1.0e-3
lr_opacities: 5.0e-2
lr_sh0: 2.5e-3
lr_shN: 1.25e-4
lr_sem: 2.5e-3

prune_opa: 0.005
grow_grad2d: 1.0e-3
grow_scale3d: 0.01
prune_scale3d: 0.1
refine_start_iter: 500
refine_stop_iter: 20000
refine_every: 200
reset_every: 3000

max_iter: 30000                 # MUST-EQ
eval_every: 2000
ckpt_every: 10000
out_dir: /workspace/JointBuildGS/results/tum_transfer/mob/gs_d5a_dense
