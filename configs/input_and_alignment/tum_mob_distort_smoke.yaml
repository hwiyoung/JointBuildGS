# P2 make-or-break — distortion scale-correction smoke (geometry-only, label-free).
# Tests whether 2DGS distortion reg can be turned ON at TUM metric scale without collapse.
# Same base as tum_vanilla_proper.yaml but max_iter=3000 and w_distort swept. Engine unchanged.
seed: 0
device: cuda

data_root: /workspace/JointBuildGS/results/tum_transfer/data
out_dir: /workspace/JointBuildGS/results/tum_transfer/mob/_distort_smoke

downscale: 1.0
sh_degree: 3
sh_up_every: 1000

w_photo: 1.0
w_depth: 0.0
w_normal: 0.0
w_nc: 0.05
w_distort: 1.0          # SWEPT by --override at runtime
photo_lam: 0.2

lr_means: 1.6e-4
lr_scales: 5.0e-3
lr_quats: 1.0e-3
lr_opacities: 5.0e-2
lr_sh0: 2.5e-3
lr_shN: 1.25e-4

prune_opa: 0.005
grow_grad2d: 5.0e-4
grow_scale3d: 0.01
prune_scale3d: 0.1
refine_start_iter: 500
refine_stop_iter: 3000
refine_every: 100
reset_every: 3000

max_iter: 3000
eval_every: 1000
ckpt_every: 3000
