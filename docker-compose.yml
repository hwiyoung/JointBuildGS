services:
  dev:
    build: .
    image: jointbuildgs:dev
    container_name: jointbuildgs-dev
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=1
      - CUDA_VISIBLE_DEVICES=0
      - TORCH_CUDA_ARCH_LIST=8.6
      - JBGS_ARTIFACT_ROOT=/artifacts/JointBuildGS
    volumes:
      - .:/workspace/JointBuildGS
      - /media/innopam/InnoPAM-8TB:/data
      - ${JBGS_ARTIFACT_HOST_ROOT:-../JointBuildGS-artifacts}:/artifacts/JointBuildGS
      # Large payloads are resolved beneath JBGS_ARTIFACT_ROOT; the repository
      # no longer exposes data/results/reports/fair-pilot compatibility roots.
    ports:
      - "6006:6006"      # TensorBoard
    shm_size: "16gb"
    ulimits:
      memlock: -1
      stack: 67108864
    working_dir: /workspace/JointBuildGS
    stdin_open: true
    tty: true
    command: sleep infinity
