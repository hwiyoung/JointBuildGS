<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가우시안 3D 보기</title>
<style>
:root { color-scheme: dark; --bg:#0b0b0d; --ui:#15161a; --line:#2c2d33; --fg:#ececf0; --mute:#9a9aa3; --accent:#69d6ff; }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:13px/1.45 system-ui, -apple-system, "Noto Sans KR", sans-serif; overflow:hidden; }
#bar { position:fixed; top:0; left:0; right:0; z-index:20; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; padding:7px 10px; background:var(--ui); border-bottom:1px solid var(--line); max-height:62vh; overflow:auto; }
#bar .row { display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; flex-basis:100%; }
#bar b { font-size:14px; }
.seg { display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
.seg button { font:inherit; border:none; background:transparent; color:var(--fg); padding:4px 9px; cursor:pointer; border-right:1px solid var(--line); }
.seg button:last-child { border-right:none; }
.seg button.on { background:var(--fg); color:#111; }
button.act { font:inherit; border:1px solid var(--line); border-radius:7px; background:transparent; color:var(--fg); padding:4px 9px; cursor:pointer; }
.lab { color:var(--mute); margin-right:4px; }
input[type=range] { width:90px; vertical-align:middle; }
a { color:var(--accent); }
#grid { position:fixed; left:0; right:0; bottom:0; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:2px; background:#000; }
#grid.one { grid-template-columns:1fr; grid-template-rows:1fr; }
.pane { position:relative; overflow:hidden; background:#050505; }
.pane canvas { display:block; width:100%; height:100%; }
.plabel { position:absolute; top:6px; left:8px; z-index:5; background:rgba(0,0,0,.72); padding:3px 7px; border-radius:4px; pointer-events:none; }
.pstats { position:absolute; bottom:6px; left:8px; right:8px; z-index:5; background:rgba(0,0,0,.78); padding:4px 8px; border-radius:4px; pointer-events:none; font-size:12px; white-space:pre-wrap; font-variant-numeric:tabular-nums; }
.tag3d { position:absolute; z-index:6; transform:translate(-50%, -50%); background:#f5c542; color:#111; font-weight:700; border-radius:14px; padding:1px 8px; cursor:pointer; white-space:nowrap; box-shadow:0 1px 4px rgba(0,0,0,.6); }
.tag3d span { font-weight:500; margin-left:4px; }
#places { flex-basis:100%; display:none; }
#places .pl { display:flex; gap:8px; align-items:baseline; margin:2px 0; }
#places .num { background:#f5c542; color:#111; font-weight:700; border-radius:12px; padding:0 7px; }
#places .sh { color:var(--mute); }
#legend { flex-basis:100%; font-size:12px; }
#legend .sw { display:inline-block; width:11px; height:11px; border-radius:2px; margin:0 4px -1px 10px; }
#legend .sw:first-child { margin-left:0; }
#help { color:var(--mute); }
.empty { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--mute); padding:20px; text-align:center; }
#info { flex-basis:100%; background:#1d1e24; border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:12.5px; display:none; }
#info table { border-collapse:collapse; margin-top:4px; }
#info td, #info th { padding:2px 9px 2px 0; text-align:left; white-space:nowrap; font-variant-numeric:tabular-nums; }
#info th { color:var(--mute); font-weight:600; }
#info .x { float:right; cursor:pointer; color:var(--mute); margin-left:10px; }
.ok { color:#4ade80; } .no { color:#f87171; }
</style>
</head>
<body>
<div id="bar">
 <div class="row">
  <b>가우시안 3D 보기</b>
  <span><span class="lab">prior</span><span class="seg" id="prior"><button data-v="M">LoD2</button><button data-v="L">ALS</button></span></span>
  <span><span class="lab">장면</span><span class="seg" id="scene"><button data-v="N">정상</button><button data-v="B">본지붕 +1 m</button></span></span>
  <span><span class="lab">보기</span><span class="seg" id="target"><button data-v="explain">설명: prior vs 실제</button><button data-v="surface">결과(조건별): 표가 센 픽셀</button><button data-v="judge">막대: 픽셀별 어긋남</button><button data-v="disks">가우시안 원반</button></span></span>
  <span><span class="lab">영역</span><span class="seg" id="region"><button data-v="1">지붕</button><button data-v="2">벽</button><button data-v="0">둘 다</button></span></span>
  <span><span class="lab">판정</span><span class="seg" id="cls"><button data-v="0">전체</button><button data-v="1">일치</button><button data-v="2">충돌</button><button data-v="3">미측정</button></span></span>
  <span><span class="lab">시점</span><span class="seg" id="preset"><button data-v="0009">영상 0009</button><button data-v="0024">영상 0024</button><button data-v="0005">영상 0005</button><button data-v="top">위에서</button><button data-v="back">뒤에서(영상 없음)</button></span></span>
 </div>
 <div id="places"></div>
 <div class="row">
  <span><span class="lab">색</span><span class="seg" id="mode"><button data-v="0">실제 색</button><button data-v="1">판정</button><button data-v="5">어긋난 크기(prior−영상)</button><button data-v="6">영상−GT</button><button data-v="7">prior−GT</button><button data-v="2">판정 부합?</button><button data-v="3">결과−GT</button><button data-v="4">출처·고정</button></span></span>
  <label id="ovMeshL"><input type="checkbox" id="ovMesh"> prior 모형</label>
  <label id="ovPL"><input type="checkbox" id="ovP"> P 결과(초록)</label>
  <label id="ovP0L"><input type="checkbox" id="ovP0"> P0 결과(빨강)</label>
  <span id="exagBox"><span class="lab">막대 과장</span><input type="range" id="exag" min="1" max="10" step="1" value="1"> <span id="exagV"></span></span>
  <label id="ovPriorL"><input type="checkbox" id="ovPrior"> prior 표면(파랑 점)</label>
  <label id="ovPhotoL"><input type="checkbox" id="ovPhoto"> 영상 표면(주황 점)</label>
  <label id="ovUnseenL"><input type="checkbox" id="ovUnseen"> 비가시 면(청록)</label>
  <label id="hiddenL"><input type="checkbox" id="hidden"> 표면에 안 드러난 원반(회색)</label>
 </div>
 <div class="row">
  <span><span class="lab">단면</span><span class="seg" id="slab"><button data-v="off">끄기</button><button data-v="across">가로(정면 벽에 수직)</button><button data-v="along">세로(정면 벽과 나란히)</button></span></span>
  <span><span class="lab">위치</span><input type="range" id="slabPos" min="-45" max="45" step="0.1" value="0"> <span id="slabPosV"></span></span>
  <span><span class="lab">두께</span><input type="range" id="slabW" min="0.1" max="3" step="0.1" value="0.5"> <span id="slabWV"></span></span>
  <button class="act" id="slabView">단면을 옆에서 보기</button>
  <span><span class="lab">점 크기</span><input type="range" id="size" min="0.5" max="3" step="0.1" value="1.2"></span>
  <span id="minABox"><span class="lab">불투명도 하한</span><input type="range" id="minA" min="0" max="0.9" step="0.05" value="0.1"></span>
  <a href="intent.html">의도 점검 표·지도</a>
 </div>
 <div id="legend"><span id="legendBody"></span><div id="help"></div></div>
 <div id="info"></div>
</div>
<div id="grid"></div>
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
<script type="module">
import * as THREE from 'three';
const FPS = 22, FPP = 13, FPI = 14, FPU = 7, FPR = 4, FPH = 11;
const NAMES = {P: 'P 판정 GS(제안)', P0: 'P0 prior 강제 GS', O: 'O 공식 GeoGS', I: 'I 영상 GS(prior 없음)'};
const SHORT = {P: 'P 판정 GS', P0: 'P0 prior 강제 GS', O: 'O 공식 GeoGS', I: 'I 영상 GS'};
const TAU = {M: 5.7, L: 4.1}, PNAME = {M: 'LoD2', L: 'ALS'};
const SETIDX = {M_N: 0, M_B: 1, L_N: 2, L_B: 3};
const MODES = {explain: ['0', '1'], judge: ['1', '5', '6', '7'], surface: ['1', '2', '3', '5', '0'], disks: ['1', '2', '3', '4', '0']};
const ONE = t => t === 'explain' || t === 'judge';
const getJSON = async u => (await fetch(u, {cache: 'no-store'})).json();
const index = await getJSON('surfels/index.json'), sindex = await getJSON('surfels/surface_index.json');
const uindex = await getJSON('surfels/unseen_index.json').catch(() => null);
const VIEWS = await getJSON('surfels/views.json').catch(() => null);
const PLACES = await getJSON('surfels/places.json').catch(() => null);
const SETS = {M_N: ['P_M_N', 'P0_M_N', 'O_M_N', 'I'], M_B: ['P_M_B', 'P0_M_B', 'O_M_B', 'I'], L_N: ['P_L_N', 'P0_L_N', 'I'], L_B: ['P_L_B', 'P0_L_B', 'I']};
let st = {prior: 'M', scene: 'N', target: 'explain', mode: '0', preset: '0009', size: 1.2, minA: 0.1, hidden: false, region: '0', cls: '0',
          ovMesh: true, ovP: false, ovP0: false, ovPrior: false, ovPhoto: false, ovUnseen: true, slab: 'off', slabPos: 0, slabW: 0.5, exag: 1};
try { Object.assign(st, JSON.parse(localStorage.getItem('surfelState4') || '{}')); } catch (e) {}
for (const kv of location.hash.replace(/^#/, '').split('&')) { const [k, v] = kv.split('='); if (k in st && v) st[k] = decodeURIComponent(v); }
for (const k of ['size', 'minA', 'slabPos', 'slabW', 'exag']) st[k] = +st[k];
for (const k of ['hidden', 'ovMesh', 'ovP', 'ovP0', 'ovPrior', 'ovPhoto', 'ovUnseen']) st[k] = st[k] === true || st[k] === 'true';
if (!MODES[st.target]) st.target = 'explain';
if (!MODES[st.target].includes(st.mode)) st.mode = MODES[st.target][0];

// section frame: front wall 3403 (outward normal n); 'across' cuts perpendicular to the front wall, 'along' parallel to it
const FR = uindex ? uindex.frame : {front_normal: [0.9302, -0.3669]};
const NF = new THREE.Vector2(FR.front_normal[0], FR.front_normal[1]).normalize(), AL = new THREE.Vector2(-NF.y, NF.x);
const SLAB_O = new THREE.Vector2(index.target_center[0], index.target_center[1]);
const slabNormal = () => st.slab === 'along' ? NF : AL;

const COMMON = `
uniform int slabOn; uniform vec2 slabO; uniform vec2 slabN; uniform float slabC; uniform float slabHalf;
bool outSlab(vec3 p) { return slabOn == 1 && abs(dot(p.xy - slabO, slabN) - slabC) > slabHalf; }
vec3 diverging(float x) { x = clamp(x, -1.0, 1.0); return x >= 0.0 ? mix(vec3(1.0), vec3(0.86, 0.1, 0.1), x) : mix(vec3(1.0), vec3(0.1, 0.25, 0.95), -x); }
vec3 classColor(float c) { return c < 1.5 ? vec3(0.26, 0.52, 0.96) : (c < 2.5 ? vec3(1.0, 0.6, 0.0) : vec3(0.61, 0.15, 0.69)); }`;
const slabUniforms = () => ({slabOn: {value: 0}, slabO: {value: SLAB_O.clone()}, slabN: {value: new THREE.Vector2(1, 0)}, slabC: {value: 0}, slabHalf: {value: 0.25}});
const HIDE = 'gl_Position = vec4(2.0, 2.0, 2.0, 1.0); gl_PointSize = 0.0; return;';
const PFS = `precision highp float; varying vec3 vColor;
void main() { vec2 c = gl_PointCoord - 0.5; if (dot(c, c) > 0.25) discard; gl_FragColor = vec4(vColor, 1.0); }`;
const LFS = `precision highp float; varying vec3 vColor; void main() { gl_FragColor = vec4(vColor, 1.0); }`;
const pointTail = (scale, maxPx) => `vec4 mv = modelViewMatrix * vec4(position, 1.0); gl_Position = projectionMatrix * mv; gl_PointSize = clamp(pointSize * ${scale} / -mv.z, 1.0, ${maxPx});`;

// real surface: the pixels the photos measured, in the photo's colour (or the judgment class of the setting)
const PHVS = `precision highp float;
attribute vec3 aRgb; attribute vec4 aCls; attribute float aReg;
uniform float pointSize; uniform int mode; uniform int setIdx; uniform int showClass; uniform int showRegion;
${COMMON}
varying vec3 vColor;
void main() {
  float cls = setIdx == 0 ? aCls.x : (setIdx == 1 ? aCls.y : (setIdx == 2 ? aCls.z : aCls.w));
  if ((showClass > 0 && abs(cls - float(showClass)) > 0.5) || (showRegion > 0 && abs(aReg - float(showRegion)) > 0.5) || outSlab(position)) { ${HIDE} }
  vColor = mode == 1 ? classColor(cls) : aRgb;
  ${pointTail('260.0', '9.0')}
}`;
// result points of one condition in a single colour (explain view)
const CVS = `precision highp float;
attribute vec4 iInfo;
uniform float pointSize; uniform int showClass; uniform int showRegion; uniform vec3 color;
${COMMON}
varying vec3 vColor;
void main() {
  vColor = color;
  if (position.x != position.x || (showClass > 0 && abs(iInfo.x - float(showClass)) > 0.5) || (showRegion > 0 && abs(iInfo.w - float(showRegion)) > 0.5) || outSlab(position)) { ${HIDE} }
  ${pointTail('220.0', '8.0')}
}`;
// judged position of each pixel: photo point where the photos measured (A=1), prior point where not
const JVS = `precision highp float;
attribute vec3 aMeta; attribute vec2 aGT;
uniform float pointSize; uniform int mode; uniform int showClass; uniform int showRegion;
${COMMON}
varying vec3 vColor;
void main() {
  float cls = aMeta.x, reg = aMeta.y, spm = aMeta.z, v = mode == 6 ? aGT.x : aGT.y;
  if (position.x != position.x || (showClass > 0 && abs(cls - float(showClass)) > 0.5) || (showRegion > 0 && abs(reg - float(showRegion)) > 0.5) || outSlab(position)) { ${HIDE} }
  if ((mode == 6 || mode == 7) && v != v) { ${HIDE} }
  if (mode == 5) vColor = spm != spm ? vec3(0.61, 0.15, 0.69) : diverging(spm / 0.5);
  else if (mode == 6 || mode == 7) vColor = diverging(v / 0.5);
  else vColor = classColor(cls);
  ${pointTail('260.0', '9.0')}
}`;
const SVS = `precision highp float;
attribute vec3 aDir; attribute float aW; attribute vec3 aMeta;
uniform float exag; uniform int showClass; uniform int showRegion;
${COMMON}
varying vec3 vColor;
void main() {
  float reg = aMeta.y, spm = aMeta.z;
  bool far = abs(spm) > 3.0;
  vColor = far ? vec3(0.85, 0.2, 0.85) : (spm > 0.0 ? mix(vec3(1.0, 0.75, 0.75), vec3(0.9, 0.12, 0.12), clamp(spm / 0.4, 0.3, 1.0))
                                                    : mix(vec3(0.7, 0.95, 1.0), vec3(0.0, 0.72, 0.85), clamp(-spm / 0.4, 0.3, 1.0)));
  if ((showClass > 0 && showClass != 2) || (showRegion > 0 && abs(reg - float(showRegion)) > 0.5) || outSlab(position)) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }
  float k = far ? 0.4 / abs(spm) : exag;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position + aDir * aW * k, 1.0);
}`;
const RVS = `precision highp float;
attribute vec3 iRgb; attribute vec4 iInfo; attribute float iSpm;
uniform float pointSize; uniform int mode; uniform int showClass; uniform int showRegion; uniform int neutral;
${COMMON}
varying vec3 vColor;
void main() {
  float cls = iInfo.x, fol = iInfo.y, herr = iInfo.z, reg = iInfo.w;
  if (position.x != position.x || (showClass > 0 && abs(cls - float(showClass)) > 0.5) || (showRegion > 0 && abs(reg - float(showRegion)) > 0.5)
      || (mode == 3 && herr != herr) || outSlab(position)) { ${HIDE} }
  if (mode == 0) vColor = iRgb;
  else if (mode == 1) vColor = classColor(cls);
  else if (mode == 2) vColor = fol > 0.5 ? vec3(0.18, 0.66, 0.28) : vec3(0.88, 0.15, 0.15);
  else if (mode == 3) vColor = diverging(herr / 0.5);
  else if (mode == 5) vColor = iSpm != iSpm ? vec3(0.61, 0.15, 0.69) : diverging(iSpm / 0.5);
  else vColor = vec3(0.42);
  if (neutral == 1) vColor = vec3(0.92);
  ${pointTail('260.0', '9.0')}
}`;
const IVS = `precision highp float;
attribute vec3 iMeta;
uniform float pointSize; uniform int showClass; uniform int showRegion; uniform vec3 color;
${COMMON}
varying vec3 vColor;
void main() {
  vColor = color;
  if (position.x != position.x || (showClass > 0 && abs(iMeta.y - float(showClass)) > 0.5) || (showRegion > 0 && abs(iMeta.z - float(showRegion)) > 0.5) || outSlab(position)) { ${HIDE} }
  ${pointTail('200.0', '7.0')}
}`;
const UVS = `precision highp float;
attribute vec4 iU;
uniform float pointSize; uniform int mode; uniform float minAlpha; uniform int showRegion; uniform int isRef;
${COMMON}
varying vec3 vColor;
void main() {
  float grp = isRef == 1 ? iU.x : iU.w;
  if ((showRegion > 0 && abs(grp - float(showRegion)) > 0.5) || outSlab(position) || (isRef == 0 && iU.x < minAlpha)) { ${HIDE} }
  if (isRef == 1) vColor = vec3(0.30, 0.36, 0.50);
  else if (mode == 4) vColor = iU.z > 0.5 ? vec3(0.55, 0.0, 0.05) : (iU.y > 0.5 ? vec3(1.0, 0.65, 0.2) : (iU.y > -0.5 ? vec3(0.2, 0.75, 0.92) : vec3(0.8)));
  else vColor = vec3(0.12, 0.85, 0.80);
  vec4 mv = modelViewMatrix * vec4(position, 1.0); gl_Position = projectionMatrix * mv;
  gl_PointSize = clamp(pointSize * (isRef == 1 ? 130.0 : 260.0) / -mv.z, 1.0, isRef == 1 ? 4.0 : 9.0);
}`;
const DVS = `precision highp float;
attribute vec3 iCenter; attribute vec3 iAxis0; attribute vec3 iAxis1; attribute vec3 iNormal;
attribute vec4 iColorAlpha; attribute vec4 iInfo; attribute vec2 iInfo2;
uniform float sizeScale; uniform int mode;
${COMMON}
varying vec2 vLocal; varying vec3 vColor; varying float vAlpha; varying float vHidden; varying vec3 vNormal; varying vec3 vWorld; varying float vCls;
void main() {
  vLocal = position.xy; vAlpha = iColorAlpha.a; vNormal = iNormal;
  float cls = iInfo.x, fol = iInfo.y, herr = iInfo.z, org = iInfo.w, locked = iInfo2.x;
  vHidden = (cls < 0.5) ? 1.0 : 0.0; vCls = cls;
  vec3 gray = vec3(0.42);
  if (mode == 0) vColor = iColorAlpha.rgb;
  else if (mode == 1) vColor = cls < 0.5 ? gray : classColor(cls);
  else if (mode == 2) vColor = fol < -0.5 ? gray : (fol > 0.5 ? vec3(0.18, 0.66, 0.28) : vec3(0.88, 0.15, 0.15));
  else if (mode == 3) vColor = (herr != herr || cls < 0.5) ? gray : diverging(herr / 0.5);
  else if (mode == 4) vColor = locked > 0.5 ? vec3(0.55, 0.0, 0.05) : (org > 0.5 ? vec3(1.0, 0.65, 0.2) : (org > -0.5 ? vec3(0.2, 0.75, 0.92) : vec3(0.8)));
  else vColor = gray;
  vec3 w = iCenter + (iAxis0 * position.x + iAxis1 * position.y) * sizeScale;
  vWorld = w;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(w, 1.0);
}`;
const DFS = `precision highp float;
uniform int mode; uniform float minAlpha; uniform int showHidden; uniform int showClass;
${COMMON}
varying vec2 vLocal; varying vec3 vColor; varying float vAlpha; varying float vHidden; varying vec3 vNormal; varying vec3 vWorld; varying float vCls;
void main() {
  float r2 = dot(vLocal, vLocal);
  if (r2 > 1.0 || vAlpha < minAlpha || outSlab(vWorld)) discard;
  if (showClass > 0 && abs(vCls - float(showClass)) > 0.5) discard;
  if (vHidden > 0.5 && showHidden == 0 && mode != 0) discard;
  float facing = 0.55 + 0.45 * abs(dot(normalize(vNormal), normalize(cameraPosition - vWorld)));
  if (mode == 0 && vAlpha * exp(-2.2 * r2) < 0.25) discard;
  gl_FragColor = vec4(vColor * facing, 1.0);
}`;

async function loadF32(url, magic, stride) {
  const buf = await (await fetch(url)).arrayBuffer();
  if (String.fromCharCode(...new Uint8Array(buf, 0, 8)) !== magic) throw new Error('bad magic ' + url);
  const dv = new DataView(buf), count = dv.getUint32(8, true), s = dv.getUint32(12, true);
  if (s !== stride) throw new Error('stride ' + s + ' ' + url);
  return {count, stride, data: new Float32Array(buf, 16, count * stride)};
}
async function loadMesh(url) {
  const buf = await (await fetch(url)).arrayBuffer();
  if (String.fromCharCode(...new Uint8Array(buf, 0, 8)) !== 'JBMS3D1\0') throw new Error('bad magic ' + url);
  const dv = new DataView(buf), nv = dv.getUint32(8, true), nt = dv.getUint32(12, true);
  return {nv, nt, V: new Float32Array(buf, 16, nv * 3), T: new Uint32Array(buf, 16 + nv * 12, nt * 3), R: new Float32Array(buf, 16 + nv * 12 + nt * 12, nt)};
}
const cache = {};
const cached = (url, magic, stride) => cache[url] || (cache[url] = loadF32(url, magic, stride));
const cachedMesh = url => cache[url] || (cache[url] = loadMesh(url));
function mat(vs, fs, u, extra = {}) { return new THREE.ShaderMaterial({vertexShader: vs, fragmentShader: fs, uniforms: {...u, ...slabUniforms()}, ...extra}); }

function photoGeometry(ph) {
  const g = new THREE.BufferGeometry(), ib = new THREE.InterleavedBuffer(ph.data, FPH);
  g.setAttribute('position', new THREE.InterleavedBufferAttribute(ib, 3, 0));
  g.setAttribute('aRgb', new THREE.InterleavedBufferAttribute(ib, 3, 3));

    <div style="margin-top:6px"><button class="act" id="cutHere">이 자리 단면으로 보기</button> <button class="act" id="zoomHere">가까이 보기</button></div>
    <div style="color:var(--mute);margin-top:4px">표시: <span style="color:#6f9bff">●</span> ${pname} 자리 <span style="color:#ffa21f">●</span> 영상이 잰 자리 ○ 결과. cm, 지붕은 연직·벽은 법선, + = ${up}. 참값은 정리한 참값(가려진 점 제거, 지면 기준 높이 맞춤).</div>`);
}

function save() { try { localStorage.setItem('surfelState4', JSON.stringify(st)); } catch (e) {} history.replaceState(null, '', '#' + Object.entries(st).map(([k, v]) => `${k}=${encodeURIComponent(v)}`).join('&')); }
function seg(id, onChange) {
  document.getElementById(id).querySelectorAll('button').forEach(b => {
    b.classList.toggle('on', b.dataset.v === String(st[id]));
    b.onclick = () => { st[id] = b.dataset.v; document.getElementById(id).querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); save(); onChange(); };
  });
}
seg('prior', loadSetting); seg('scene', loadSetting); seg('mode', applyDisplay);
seg('target', () => { if (!MODES[st.target].includes(st.mode)) { st.mode = MODES[st.target][0]; seg('mode', applyDisplay); } save(); loadSetting(); });
seg('region', applyDisplay); seg('cls', applyDisplay);
seg('preset', () => setPreset(st.preset)); seg('slab', applyDisplay);
for (const id of ['size', 'minA', 'slabPos', 'slabW', 'exag']) { const el = document.getElementById(id); el.value = st[id]; el.oninput = () => { st[id] = +el.value; save(); applyDisplay(); }; }
for (const id of ['hidden', 'ovMesh', 'ovP', 'ovP0', 'ovPrior', 'ovPhoto', 'ovUnseen']) { const el = document.getElementById(id); el.checked = st[id]; el.onchange = () => { st[id] = el.checked; save(); applyDisplay(); }; }
document.getElementById('slabView').onclick = () => {
  if (st.slab === 'off') { st.slab = 'across'; seg('slab', applyDisplay); applyDisplay(); }
  st.preset = 'slab'; seg('preset', () => setPreset(st.preset)); save(); setPreset('slab');
};
layout();
await loadSetting();
{ // building centre height = median height of the judged points
  const I = inputs.data, zs = [];
  for (let i = 0; i < inputs.count; i += Math.max(1, Math.floor(inputs.count / 20000))) { const z = I[i * FPI + 5] === I[i * FPI + 5] ? I[i * FPI + 5] : I[i * FPI + 2]; if (z === z) zs.push(z); }
  zs.sort((x, y) => x - y); if (zs.length) center.z = zs[Math.floor(zs.length / 2)];
}
setPreset(st.preset);
{ // shareable camera: #...&cam=<target x>,<y>,<z>,<yaw>,<pitch>,<distance>
  const cm_ = location.hash.match(/(?:^#|&)cam=([-0-9.,]+)/);
  if (cm_) { const c = cm_[1].split(',').map(Number); if (c.length === 6 && c.every(Number.isFinite)) { orbit.target.set(c[0], c[1], c[2]); orbit.yaw = c[3]; orbit.pitch = c[4]; orbit.dist = c[5]; } }
}
{ // shareable: #...&place=<n> (explain view) or #...&pick=<record index>[&cut=1]
  const pm = location.hash.match(/(?:^#|&)place=(\d+)/), m = location.hash.match(/(?:^#|&)pick=(\d+)/);
  if (pm && st.target === 'explain' && PLACES) goPlace((PLACES.places[`${st.prior}_${st.scene}`] || []).find(q => q.n === +pm[1]));
  else if (m) { showPixel(+m[1]); if (/(?:^#|&)cut=1/.test(location.hash)) cutAt(picked); }
}
const v3 = new THREE.Vector3();
(function loop() {
  for (const [i, p] of panes.entries()) {
    if (ONE(st.target) && i > 0) continue;
    applyOrbit(p.cam); if (p.objs.length) p.renderer.render(p.scene, p.cam); else p.renderer.clear();
    if (p.tags.length) {
      const w = p.el.clientWidth, h = p.el.clientHeight;
      for (const t of p.tags) {
        v3.copy(t.pos).project(p.cam);
        const vis = v3.z < 1 && Math.abs(v3.x) < 1.1 && Math.abs(v3.y) < 1.1 && (t.kind === 'place' ? st.slab === 'off' : st.slab !== 'off');
        t.el.style.display = vis ? '' : 'none';
        if (vis) { t.el.style.left = ((v3.x + 1) / 2 * w) + 'px'; t.el.style.top = ((1 - v3.y) / 2 * h) + 'px'; }
      }
    }
  }
  requestAnimationFrame(loop);
})();
window.__ready = true;
</script>
