<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Prior–MVS · 표면 근거와 Gaussian 수정 비교</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#192a32;background:#edf2f4;font-synthesis:none;line-height:1.6;--ink:#192a32;--muted:#5c6d77;--line:#d8e2e6;--teal:#087d7a;--amber:#795a15}
*{box-sizing:border-box}body{margin:0}a{color:#076c83;text-underline-offset:3px}button,select{font:inherit}button,select,a{touch-action:manipulation}button:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #008eac;outline-offset:3px}header,.page{max-width:1020px;margin:auto;padding:22px 18px}header{padding-bottom:15px}.eyebrow{font-size:12px;font-weight:750;letter-spacing:.06em;color:var(--teal)}h1{font-size:clamp(23px,4.5vw,33px);line-height:1.3;letter-spacing:-.035em;margin:9px 0 12px}h2{font-size:20px;line-height:1.35;margin:0}h3{font-size:17px;margin:0}.lead{font-size:15px;color:#405662;margin:0;max-width:800px}.small{font-size:12px;color:var(--muted)}.toolbar{position:sticky;top:0;z-index:5;background:rgba(247,250,251,.96);border-block:1px solid var(--line);backdrop-filter:blur(10px)}.controls{max-width:1020px;margin:auto;padding:10px 18px;display:flex;gap:12px;align-items:center}.regions{display:flex;gap:5px;flex:none}.regions button{border:1px solid var(--line);border-radius:8px;padding:8px 14px;background:white;color:var(--ink);font-weight:700;min-height:44px;cursor:pointer}.regions button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:white}.case-control{flex:1;min-width:0}.case-control label{display:block;font-size:11px;color:var(--muted)}select{width:100%;min-height:35px;border:1px solid var(--line);border-radius:6px;background:white;color:var(--ink);padding:4px 28px 4px 8px;max-width:100%}.page{padding-top:17px}.case-head{border:1px solid var(--line);background:white;border-radius:12px;padding:18px;margin-bottom:16px}.case-title{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.badge{font-size:12px;padding:4px 8px;border-radius:6px;background:#e2f3ee;color:#116446;font-weight:750;white-space:nowrap}.badge.defer{background:#faf0d7;color:var(--amber)}.badge.pending{background:#e9edf0;color:#53616b}.reason-title{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 3px}.reasons{padding-left:20px;margin:0;font-size:13px;overflow-wrap:anywhere}.stage-nav{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 20px}.stage-nav a{border:1px solid var(--line);background:white;border-radius:6px;padding:5px 10px;font-size:12px;text-decoration:none}.stage{background:white;border:1px solid var(--line);border-radius:12px;margin-bottom:18px;overflow:hidden;scroll-margin-top:100px}.stage summary{list-style:none;display:flex;gap:12px;align-items:center;padding:17px;cursor:pointer}.stage summary::-webkit-details-marker{display:none}.stage summary::after{content:"＋";margin-left:auto;color:var(--muted);font-size:20px}.stage[open] summary::after{content:"−"}.number{display:grid;place-items:center;width:32px;height:32px;flex:none;border-radius:50%;background:#e9f3f4;color:var(--teal);font-weight:800;font-size:14px}.stage-body{padding:0 17px 18px}.stage-text{margin:0 0 14px;color:#415962;font-size:14px;white-space:pre-line;overflow-wrap:anywhere}.figures{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:13px}.figure{margin:0;border:1px solid var(--line);border-radius:7px;overflow:hidden;align-self:start}.figure a{display:block;background:#f4f6f7}.figure img{display:block;width:100%;height:auto;min-height:40px}.figure figcaption{font-size:12px;padding:8px 10px;color:#465e68;overflow-wrap:anywhere}.open-hint{font-size:11px;color:#71838c;padding-top:2px}.metrics{width:100%;border-collapse:collapse;font-size:13px;margin-top:15px;table-layout:fixed}.metrics th,.metrics td{text-align:left;vertical-align:top;padding:8px;border-bottom:1px solid #e5ecef;overflow-wrap:anywhere}.metrics th{width:58%;font-weight:500;color:#435b67}.metrics td{font-variant-numeric:tabular-nums}.empty{background:#f2f5f7;border-radius:7px;padding:12px;font-size:13px;color:var(--muted)}.status-note{font-size:13px;margin:12px 0 0;color:#415962;white-space:pre-line}.receipts{border-top:1px solid var(--line);padding-top:17px;margin-top:28px}.receipts ul{padding-left:19px;font-size:13px}.receipts li{margin:6px 0}.footer{margin-top:20px;padding-bottom:20px;color:var(--muted);font-size:12px}.error{color:#9f2b25;background:#fff0ed;border:1px solid #edc7c1;padding:15px;border-radius:8px}.value-object{margin:0;white-space:pre-wrap;font-family:inherit;font-size:12px}.error-image{padding:15px;color:#9f2b25;font-size:12px}.probe-note{border-left:3px solid var(--teal);padding:4px 0 4px 12px;margin-top:12px}.loading{padding:40px 20px;text-align:center;color:var(--muted)}
@media(max-width:540px){header,.page{padding-left:12px;padding-right:12px}.controls{padding:8px 12px;gap:9px}.regions button{padding:7px 11px}.case-head{padding:14px}.case-title{display:block}.case-title .badge{display:inline-block;margin-top:8px}.stage summary{padding:14px 12px;gap:9px}.stage-body{padding:0 12px 14px}.number{width:28px;height:28px}.stage h3{font-size:16px}.metrics th{width:57%}.metrics td,.metrics th{padding:7px 4px}.stage-nav a{padding:6px 8px}.figures{grid-template-columns:1fr}}
@media print{.toolbar,.stage-nav{position:static;display:none}.stage,.case-head{break-inside:avoid;border-color:#aaa}.stage summary::after{display:none}body{background:white}.page,header{max-width:none}.figure{break-inside:avoid}}
</style>
</head>
<body>
<header>
  <div class="eyebrow">P1 · P2 · P3 / 관측 근거 → 국소 수정 → 전후 비교</div>
  <h1>같은 표면을 단계별로 확인합니다</h1>
  <p class="lead" id="lead">Prior와 MVS의 불일치가 어떤 관측으로 지지되는지, 실제 Gaussian 수정이 영상과 주변 형상을 어떻게 바꾸는지 연결해 봅니다.</p>
</header>
<div class="toolbar"><div class="controls"><div id="regions" class="regions" role="group" aria-label="지역 선택"></div><div class="case-control"><label for="case">검토할 표면 사례</label><select id="case" aria-label="표면 사례 선택"></select></div></div></div>
<main class="page" id="main"><div class="loading">검토 자료를 불러오는 중입니다.</div></main>
<script src="data.js"></script>
<script>
(()=>{'use strict';
const data=window.SURFACE_UPDATE,main=document.getElementById('main'),regionBox=document.getElementById('regions'),caseSelect=document.getElementById('case');
const el=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e};
const missing=x=>x===null||x===undefined||typeof x==='number'&&!Number.isFinite(x);
function display(x){if(missing(x))return '미산출';if(typeof x==='boolean')return x?'예':'아니오';if(typeof x==='number')return Number.isInteger(x)?x.toLocaleString('ko-KR'):x.toLocaleString('ko-KR',{maximumSignificantDigits:6});if(typeof x==='object')return JSON.stringify(x,null,2);return String(x)}
const labels={IMAGE_SUPPORTED_LOCAL_PROBE:'국소 수정 검토',ABSTAIN:'업데이트 유보',AGREE_NO_UPDATE:'일치 · 유지',BOUNDED_PROBE_APPLIED:'제한된 수정 적용',NO_UPDATE_ABSTAIN:'수정 유보',PASS_BOUNDED_INFERENCE_DIAGNOSTIC:'전후 계산 완료',PENDING:'아직 미산출'};
const reasonLabels={candidate_discrepancy:'설정한 깊이차 기준에 해당하지 않음',same_neighbor_support:'가시성·사진·깊이 탐색을 함께 지지하는 동일 시점이 부족함',low_absolute_profile_cost:'깊이를 탐색해도 사진 비용이 충분히 낮지 않음',localized_profile:'낮은 사진 비용을 보이는 깊이 구간이 너무 넓거나 미산출',resolved_depth_grid:'탐색 깊이 간격이 너무 크거나 미산출',single_interval:'구분 가능한 단일 깊이 구간이 확인되지 않음',search_interior:'낮은 비용 구간이 탐색 경계에 닿거나 미산출',mvs_matches_profile:'MVS 깊이와 사진 비용 최저점이 충분히 일치하지 않음',parallax:'깊이 판별에 사용할 시차가 부족하거나 미산출',SOURCE_EVIDENCE_NOT_APPROVED_FOR_PROBE:'관측 판정에서 수정 근거가 충족되지 않음',NO_LOCAL_GEOMETRY_AND_CONTRIBUTION_ASSOCIATION:'해당 표면에 국소적으로 기여하는 Gaussian 연결이 확인되지 않음',ASSOCIATION_EXCEEDS_ID_CAP:'연결된 Gaussian 수가 이번 수정 한도를 초과함',SELECTED_IDS_EXPLAIN_LT_5_PERCENT_TARGET_ALPHA:'연결된 Gaussian의 대상 영역 렌더링 기여가 너무 작음'};
function badge(value){const raw=value||'PENDING',b=el('span',labels[raw]||raw,'badge');if(/ABSTAIN|DEFER/.test(raw))b.classList.add('defer');if(/PENDING|UNKNOWN/.test(raw))b.classList.add('pending');return b}
function metrics(rows,parent){if(!rows)return;if(!Array.isArray(rows))rows=Object.entries(rows).map(([name,value])=>({name,value}));if(!rows.length)return;const table=el('table',undefined,'metrics'),body=el('tbody');table.setAttribute('aria-label','단계별 수치');for(const row of rows){const tr=el('tr'),th=el('th',row.name??row.label??''),td=el('td');th.scope='row';const value=row.value;if(value&&typeof value==='object')td.append(el('pre',display(value),'value-object'));else td.textContent=display(value)+(missing(value)||!row.unit?'':' '+row.unit);tr.append(th,td);body.append(tr)}table.append(body);parent.append(table)}
function figure(row,parent){if(!row||!row.src)return;const f=el('figure',undefined,'figure'),a=el('a'),img=el('img');a.href=row.src;a.target='_blank';a.rel='noopener';a.setAttribute('aria-label',(row.label||'결과 그림')+' 원본 열기');img.src=row.src;img.alt=row.label||'단계 결과 그림';img.loading='lazy';img.decoding='async';img.addEventListener('error',()=>{if(!f.querySelector('.error-image'))f.prepend(el('div','그림을 불러오지 못했습니다. 원본 링크를 확인하세요.','error-image'))});a.append(img);const caption=el('figcaption',row.label||'결과 그림');caption.append(el('div','그림을 누르면 원본을 확대할 수 있습니다.','open-hint'));f.append(a,caption);parent.append(f)}
function stage(row,index){const d=el('details',undefined,'stage');d.open=true;d.id='stage-'+(index+1);const s=el('summary');s.append(el('span',String(index+1),'number'),el('h3',row.title||'결과 확인'));d.append(s);const body=el('div',undefined,'stage-body');if(row.summary)body.append(el('p',display(row.summary),'stage-text'));if(row.images?.length){const figures=el('div',undefined,'figures');for(const image of row.images)figure(image,figures);body.append(figures)}metrics(row.metrics,body);if(!row.summary&&!row.images?.length&&!row.metrics)body.append(el('p','이 단계는 아직 산출되지 않았습니다.','empty'));d.append(body);return d}
let ri=0,ci=0;
function chooseRegion(index){ri=index;ci=0;for(const [i,b]of [...regionBox.children].entries())b.setAttribute('aria-pressed',String(i===ri));const region=data.regions[ri];caseSelect.replaceChildren();for(const [i,c]of(region.cases||[]).entries()){const option=el('option',c.label||c.id||c.case_id||'사례 '+(i+1));option.value=String(i);caseSelect.append(option)}render()}
function render(){main.replaceChildren();const region=data.regions[ri],c=region.cases?.[ci];if(!c){main.append(el('p','이 지역의 사례는 아직 산출되지 않았습니다.','empty'));return}const head=el('section',undefined,'case-head'),title=el('div',undefined,'case-title');title.append(el('h2',region.id+' · '+(c.label||c.id||c.case_id)),badge(c.decision));head.append(title);if(c.reason_codes?.length){head.append(el('div','현재 판정의 이유','reason-title'));const list=el('ul',undefined,'reasons');for(const reason of c.reason_codes)list.append(el('li',reasonLabels[reason]||display(reason)));head.append(list)}if(c.probe){const note=el('div',undefined,'probe-note');note.append(badge(c.probe.status));if(c.probe.summary)note.append(el('p',display(c.probe.summary),'status-note'));head.append(note)}main.append(head);const stages=c.stages||[],nav=el('nav',undefined,'stage-nav');nav.setAttribute('aria-label','단계 바로 가기');stages.forEach((s,i)=>{const a=el('a',(i+1)+'단계');a.href='#stage-'+(i+1);nav.append(a)});main.append(nav);stages.forEach((s,i)=>main.append(stage(s,i)));if(!stages.length)main.append(el('p','단계별 자료가 아직 연결되지 않았습니다.','empty'));if(c.probe?.metrics){const panel=el('section',undefined,'case-head');panel.append(el('h3','수정 전후 수치'));metrics(c.probe.metrics,panel);main.append(panel)}if(data.receipts?.length){const sec=el('section',undefined,'receipts');sec.append(el('h3','원자료와 실행 기록'));const list=el('ul');for(const receipt of data.receipts){if(!receipt.path)continue;const li=el('li'),a=el('a',receipt.label||'실행 기록');a.href=receipt.path;a.target='_blank';a.rel='noopener';li.append(a);list.append(li)}sec.append(list);main.append(sec)}main.append(el('p','영상 적합도와 형상 변화는 같은 입력·같은 checkpoint에서의 관측 비교입니다. 실제 시간 변화나 독립적인 기하 정확도를 확정하는 결과는 아닙니다. 미산출·판단 유보는 0 또는 성공으로 표시하지 않습니다.','footer'));main.dataset.region=region.id;main.dataset.case=c.id||c.case_id||String(ci);document.title=region.id+' · '+(c.label||c.id||c.case_id)+' | 표면 근거와 수정 비교'}
if(!data||!Array.isArray(data.regions)||!data.regions.length){main.replaceChildren(el('p','검토 자료(data.js)가 없거나 지역 목록이 비어 있습니다.','error'));caseSelect.disabled=true;return}
if(typeof data.summary==='string')document.getElementById('lead').textContent=data.summary;else if(data.summary?.description)document.getElementById('lead').textContent=data.summary.description;
data.regions.forEach((r,i)=>{const b=el('button',r.id);b.type='button';b.setAttribute('aria-pressed','false');b.addEventListener('click',()=>chooseRegion(i));regionBox.append(b)});caseSelect.addEventListener('change',()=>{ci=Number(caseSelect.value);render();window.scrollTo({top:0,behavior:'auto'})});chooseRegion(0);
})();
</script>
</body>
</html>
