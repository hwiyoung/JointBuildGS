<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소스 선택 + 2DGS · P1·P2·P3 단계별 실험</title>
<style>
:root{color-scheme:light;--ink:#173b48;--muted:#526875;--line:#d5e2e7;--accent:#007c77;--bg:#f3f7f8;--warn:#805500}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;line-height:1.65}main{max-width:1240px;margin:0 auto;padding:28px 22px 80px}h1{font-size:clamp(1.45rem,4vw,2.05rem);line-height:1.35;margin:8px 0 12px}h2{font-size:1.3rem;line-height:1.4;margin:8px 0 12px}p{margin:10px 0}a{color:#006a80;text-underline-offset:3px;overflow-wrap:anywhere}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #df951f;outline-offset:3px}.eyebrow{font-size:.77rem;letter-spacing:.08em;color:var(--muted)}.notice,.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:18px;margin:16px 0}.notice{border-left:4px solid var(--accent)}.status{font-size:.83rem;border-radius:6px;padding:5px 8px;background:#e5f2ed;display:inline-block;max-width:100%;overflow-wrap:anywhere}.status.pending{background:#fff2d4;color:var(--warn)}.status.fail{background:#fde4e1;color:#9c2920}.small{font-size:.87rem;color:var(--muted)}nav{display:flex;gap:9px;margin:22px 0 10px}nav button{border:1px solid var(--line);border-radius:9px;padding:10px 28px;background:white;font-weight:700}button.active{background:var(--ink);border-color:var(--ink);color:white}.stage-nav{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;margin:16px 0}.stage-nav button{min-width:0;border:1px solid var(--line);background:white;border-radius:8px;padding:10px 5px;font-size:.78rem;line-height:1.45}.stage-nav button.active{background:var(--ink);color:white}.stage-nav strong{display:block;font-size:1.05rem;margin-bottom:4px}.stage-nav .tag{font-size:.67rem;color:var(--muted)}.stage-nav .active .tag{color:#b9d8d9}.stage-header{display:flex;align-items:center;justify-content:space-between;gap:16px}.stage-title{flex:1;min-width:0}.images{display:grid;gap:20px;margin:20px 0}.image-block{margin:0;min-width:0}.image-block img{display:block;width:100%;height:auto;border:1px solid var(--line);background:#edf2f4;border-radius:6px}.image-block figcaption{font-size:.86rem;margin:7px 0;color:var(--muted)}.image-block a{display:block}.empty{padding:32px 20px;text-align:center;border:1px dashed #b7c6cc;border-radius:8px;background:#fafcfc;color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:.9rem;table-layout:fixed}th,td{padding:10px 12px;border-bottom:1px solid #e1e8eb;text-align:left;overflow-wrap:anywhere}th{width:68%;font-weight:500}td{font-variant-numeric:tabular-nums}.links{display:flex;gap:12px 24px;flex-wrap:wrap;margin:14px 0}.links a{font-size:.88rem}.stage-actions{display:flex;justify-content:space-between;gap:12px;margin-top:22px}.stage-actions button{border:1px solid var(--line);padding:8px 18px;border-radius:7px;background:white}.stage-actions button:disabled{opacity:.4;cursor:default}details{margin:18px 0}summary{cursor:pointer;font-weight:600}.limitations{font-size:.89rem;color:var(--muted);padding-left:20px}.limitations li{margin:8px 0}.error{color:#ad281e;white-space:pre-wrap}.updated{font-size:.78rem;color:var(--muted);overflow-wrap:anywhere}.screen-reader{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:700px){main{padding:20px 12px 60px}.panel,.notice{padding:14px}nav button{flex:1;padding:10px 14px}.stage-nav{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.stage-nav button{font-size:.71rem;padding:8px 3px}.stage-header{align-items:flex-start;flex-direction:column;gap:0}h2{font-size:1.13rem}th,td{padding:9px 6px;font-size:.81rem}th{width:63%}.links{gap:8px 14px}.image-block figcaption{font-size:.8rem}}
</style>
<main>
<div class="eyebrow">PHD-SOURCE-SELECTED-2DGS-v1 · 기술 실험</div>
<h1>소스 선택 이후, 2DGS는 무엇을 바꾸는가?</h1>
<p id="summary">고정된 소스 판정과 단계별 결과를 불러오는 중입니다.</p>
<div class="notice"><span class="status pending" id="run-status" role="status">진행 상태 확인 중</span><p id="run-explanation" class="small">완료되지 않은 단계는 대기로 표시하며, 결과를 0으로 채우지 않습니다.</p><div id="updated" class="updated"></div></div>
<div id="top-links" class="links"></div>
<nav id="region-nav" aria-label="지역 선택"></nav>
<div id="region-description" class="small"></div>
<div id="stage-nav" class="stage-nav" aria-label="단계 선택"></div>
<section id="stage-panel" class="panel" aria-live="polite"></section>
<details id="region-metrics"><summary>대표 시점 핵심 수치</summary><div id="metric-table"></div></details>
<details><summary>원자료·학습·평가 기록</summary><div id="region-links" class="links"></div></details>
<details open><summary>이 결과의 해석 범위</summary><ul id="limitations" class="limitations"></ul></details>
<div id="error" class="error" role="alert"></div>
</main>
<script>
'use strict';
let data=null,regionIndex=0,stageIndex=0,signature='',statusText='';
const $=s=>document.querySelector(s);
const element=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e};
function value(v){if(v===null||v===undefined)return '미산출';if(typeof v==='boolean')return v?'확인':'불일치';if(typeof v==='number')return Number.isInteger(v)?v.toLocaleString('ko-KR'):v.toLocaleString('ko-KR',{maximumFractionDigits:6});if(typeof v==='object')return JSON.stringify(v);return String(v)}
function links(parent,rows){parent.replaceChildren();for(const row of rows||[]){const a=element('a',row.label);a.href=row.href;a.target='_blank';a.rel='noopener';parent.append(a)}}
function metrics(parent,rows){parent.replaceChildren();if(!rows?.length){parent.append(element('p','아직 산출된 수치가 없습니다.','small'));return}const table=element('table');const caption=element('caption','단계별 실제 측정값','screen-reader');table.append(caption);const body=element('tbody');for(const row of rows){const tr=element('tr'),th=element('th',row.label),td=element('td',value(row.value)+(row.unit?' '+row.unit:''));th.scope='row';tr.append(th,td);body.append(tr)}table.append(body);parent.append(table)}
function stateLabel(state){const map={PREPARED:'준비됨',PENDING:'대기',PENDING_TRAINING:'학습 대기',COMPLETE:'모든 실행·검증 완료',COMPLETE_TECHNICAL_DIAGNOSTIC:'기술 비교 문서 완료',BUILDING:'입력 구성 중',PREPARED_STAGES_ONLY:'1–5단계 준비됨',WAITING_EXISTING_TRAINING:'기존 실험 완료 대기',WAITING_GPU:'GPU 자원 대기',GPU_PREFLIGHT:'GPU 사전 검증',TRAINING:'2DGS 학습 중',EVALUATING:'형상·영상·주변 영향 평가 중',VALIDATING_FINAL_REPORT:'최종 보고서 검증 중',FAILED:'실패 · 기록 확인 필요',FAIL_FROZEN_GEOMETRY_INVARIANT:'형상 고정 검사 실패'};const prefix=state.split(/\s+/)[0];return map[state]||(map[prefix]?map[prefix]+' · '+state.slice(prefix.length).trim():state)}
function renderStatus(){const live=statusText.trim(),s=live||data?.status||'PENDING',failed=/^FAIL/.test(live)||/^FAIL/.test(data?.status||''),complete=/^COMPLETE(?:\s|$)/.test(live)&&data?.status==='COMPLETE_TECHNICAL_DIAGNOSTIC';$('#run-status').textContent=stateLabel(s);$('#run-status').className='status'+(failed?' fail':complete?'':' pending');$('#run-explanation').textContent=failed?'실행·검증 실패 기록을 확인하세요. 생성된 단계별 자료는 아래에서 계속 열람할 수 있습니다.':complete?'두 소스 조립, 각 arm의 최적화 전후, 최종 arm 차이와 후속 검증을 모두 저장했습니다. 기술 진단이며 과학적 판정은 null입니다.':/^VALIDATING_FINAL_REPORT/.test(live)?'결과 문서를 생성했고 브라우저와 산출물 완료 검증을 진행 중입니다.':'현재 단계의 실제 자료만 표시합니다. 이후 학습·평가 결과는 완료 시 자동으로 나타납니다. 기존 실행 중인 실험의 자원을 먼저 보장합니다.';$('#updated').textContent=data?'결과 문서 갱신: '+data.generated_utc+' · 상태는 30초마다 확인':''}
function render(){if(!data)return;$('#summary').textContent=data.summary;renderStatus();links($('#top-links'),data.links);const rn=$('#region-nav');rn.replaceChildren();for(let i=0;i<data.regions.length;i++){const r=data.regions[i],b=element('button',r.id,i===regionIndex?'active':'');b.type='button';b.setAttribute('aria-pressed',String(i===regionIndex));b.onclick=()=>{regionIndex=i;render()};rn.append(b)}const region=data.regions[regionIndex];$('#region-description').textContent=region.representative_view?'그림의 대표 시점: '+region.representative_view+' · 고정된 소스 선택 픽셀이 가장 많은 시점이며, 성능이나 UAS 결과로 고르지 않았습니다.':'P1·P2·P3에 같은 판정 기준을 적용합니다. 단계는 아래에서 순서대로 확인할 수 있습니다.';const sn=$('#stage-nav');sn.replaceChildren();for(let i=0;i<region.stages.length;i++){const stage=region.stages[i],b=element('button',undefined,i===stageIndex?'active':'');b.type='button';b.append(element('strong',stage.number+'단계'),element('span',stage.title),element('div',stateLabel(stage.status),'tag'));b.setAttribute('aria-pressed',String(i===stageIndex));b.onclick=()=>{stageIndex=i;render()};sn.append(b)}const stage=region.stages[stageIndex],panel=$('#stage-panel');panel.replaceChildren();const head=element('div',undefined,'stage-header');head.append(element('h2',stage.number+'단계 · '+stage.title,'stage-title'),element('span',stateLabel(stage.status),'status'+(stage.status==='PENDING'?' pending':'')));panel.append(head,element('p',stage.description));if(stage.images?.length){const images=element('div',undefined,'images');for(const img of stage.images){const f=element('figure',undefined,'image-block'),a=element('a'),im=element('img');a.href=img.src;a.target='_blank';a.rel='noopener';im.src=img.src;im.alt=region.id+' '+stage.number+'단계 '+img.label;im.loading='lazy';a.append(im);f.append(a,element('figcaption',img.label+' · 누르면 원본 확대'));images.append(f)}panel.append(images)}else{panel.append(element('div','이 단계의 실제 결과가 아직 없습니다. 학습·평가가 완료되면 여기에 표시됩니다.','empty'))}const mt=element('div');metrics(mt,stage.metrics);panel.append(mt);if(stage.links?.length){const l=element('div',undefined,'links');links(l,stage.links);panel.append(l)}const actions=element('div',undefined,'stage-actions'),back=element('button','← 이전 단계'),next=element('button','다음 단계 →');back.type=next.type='button';back.disabled=stageIndex===0;next.disabled=stageIndex===region.stages.length-1;back.onclick=()=>{stageIndex--;render();$('#stage-nav').scrollIntoView({behavior:'smooth',block:'start'})};next.onclick=()=>{stageIndex++;render();$('#stage-nav').scrollIntoView({behavior:'smooth',block:'start'})};actions.append(back,next);panel.append(actions);metrics($('#metric-table'),region.metrics);links($('#region-links'),region.links);$('#limitations').replaceChildren(...data.limitations.map(x=>element('li',x)));$('#error').textContent=''}
async function refresh(){try{const [result,status]=await Promise.allSettled([fetch('data.json',{cache:'no-store'}),fetch('../status.txt',{cache:'no-store'})]);if(status.status==='fulfilled'&&status.value.ok)statusText=await status.value.text();if(result.status!=='fulfilled'||!result.value.ok)throw new Error('단계별 자료를 아직 읽을 수 없습니다. 잠시 후 다시 확인합니다.');const text=await result.value.text();if(text!==signature){const parsed=JSON.parse(text);if(!Array.isArray(parsed.regions)||parsed.regions.length===0)throw new Error('지역 자료가 준비되지 않았습니다.');data=parsed;signature=text;regionIndex=Math.min(regionIndex,data.regions.length-1);render()}else renderStatus()}catch(error){$('#error').textContent=error.message}}
refresh();setInterval(refresh,30000);
</script>
</html>
