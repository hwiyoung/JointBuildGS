name: jointbuildgs-p0

x-p0-common: &p0-common
  working_dir: /workspace/runs
  user: "${P0_UID:-1000}:${P0_GID:-1000}"
  environment:
    HOME: /tmp
  volumes:
    - ../data:/workspace/data
    - ../runs:/workspace/runs
    - ../scripts:/workspace/scripts:ro
    - ../docs:/workspace/docs:ro

services:
  colmap:
    <<: *p0-common
    image: colmap/colmap@sha256:187ca5ec98e55ed8fbec5f43f9d8f78b7a322b3b7413356634191f7a43c1efcf
    gpus: all

  openmvs:
    <<: *p0-common
    image: jointbuildgs-p0-openmvs:t0
    build:
      context: ..
      dockerfile: env/Dockerfile.openmvs

  roofer:
    <<: *p0-common
    image: 3dgi/roofer@sha256:dd2c415aaee337502bde0dc1426dfa9c9f88e648f9d2f6340110c49932c251d2

  tools:
    <<: *p0-common
    image: jointbuildgs-p0-tools:t0
    build:
      context: ..
      dockerfile: env/Dockerfile.tools

networks:
  default:
    ipam:
      config:
        - subnet: 10.251.0.0/24
