<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JointBuildGS Phase 1 — 4-way PLY viewer</title>
<style>
  body { margin: 0; background: #1a1a1a; color: #eee; font-family: -apple-system, "Segoe UI", monospace; overflow: hidden; }
  #grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px; height: 100vh; width: 100vw; }
  .panel { position: relative; background: #0c0c0c; overflow: hidden; }
  .label { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.75); color: #eee; padding: 4px 10px; z-index: 10; font-size: 13px; border-radius: 3px; pointer-events: none; }
  .info { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.5); color: #aaa; padding: 4px 8px; z-index: 10; font-size: 11px; border-radius: 3px; pointer-events: none; }
  canvas { width: 100%; height: 100%; display: block; }
  #controls { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); padding: 8px 14px; z-index: 20; border-radius: 6px; font-size: 12px; }
  #controls label { margin-right: 16px; }
  #status { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); color: #ffd; z-index: 20; font-size: 12px; background: rgba(0,0,0,0.7); padding: 4px 10px; border-radius: 3px; }
  #note { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); color: #ccc; padding: 6px 12px; z-index: 19; border-radius: 4px; font-size: 10px; max-width: 600px; text-align: center; }
</style>
</head>
<body>
  <div id="status">Loading PLYs…</div>
  <div id="note">Note: 500k primitives subsampled, rendered as points (Three.js has no native 2DGS disk splat).<br>Color = primitive normal direction (n+1)/2. Same color = same plane orientation.</div>
  <div id="grid">
    <div class="panel"><div class="label">Baseline (Step 1-3)</div><div class="info">-</div></div>
    <div class="panel"><div class="label">Mutual (Step 1-4)</div><div class="info">-</div></div>
    <div class="panel"><div class="label">Structure (Step 1-5)</div><div class="info">-</div></div>
    <div class="panel"><div class="label">Both (Step 1-6)</div><div class="info">-</div></div>
  </div>
  <div id="controls">
    <label>Point size <input type="range" id="ptsize" min="1" max="20" step="0.5" value="4"></label>
    <label><input type="checkbox" id="attn" checked> Size attenuation (perspective)</label>
    <label><input type="checkbox" id="sync" checked> Sync camera</label>
    <label><button id="reset">Reset view</button></label>
  </div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';

const conditions = [
  { url: '../ply_web/baseline.ply',  label: 'Baseline'  },
  { url: '../ply_web/mutual.ply',    label: 'Mutual'    },
  { url: '../ply_web/structure.ply', label: 'Structure' },
  { url: '../ply_web/both.ply',      label: 'Both'      },
];

const panels = [...document.querySelectorAll('.panel')];
const infos  = [...document.querySelectorAll('.info')];
const status = document.getElementById('status');
const views = [];

function initPanel(panel) {
  const canvas = document.createElement('canvas');
  panel.appendChild(canvas);
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
  renderer.setClearColor(0x0c0c0c, 1);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, 1, 0.01, 10000);
  const controls = new OrbitControls(camera, canvas);
  controls.enableDamping = false;  // DISABLE damping for clean sync
  return { renderer, scene, camera, controls, canvas, geometry: null, points: null };
}
conditions.forEach((c, i) => views.push(initPanel(panels[i])));

const material = new THREE.PointsMaterial({
  size: 4, vertexColors: true, sizeAttenuation: true,
});

const loader = new PLYLoader();
let sharedCenter = null;
let sharedRadius = null;
let loaded = 0;

conditions.forEach((cond, i) => {
  loader.load(cond.url, (geom) => {
    geom.computeBoundingBox();
    if (sharedCenter === null) {
      // Use first loaded geom's center + radius as shared reference for ALL panels
      sharedCenter = new THREE.Vector3();
      geom.boundingBox.getCenter(sharedCenter);
      geom.computeBoundingSphere();
      sharedRadius = geom.boundingSphere.radius;
    }
    // Translate by SHARED center (not each geom's own) so all scenes align
    geom.translate(-sharedCenter.x, -sharedCenter.y, -sharedCenter.z);
    const points = new THREE.Points(geom, material.clone());
    views[i].scene.add(points);
    views[i].geometry = geom;
    views[i].points = points;
    const N = geom.attributes.position.count;
    infos[i].textContent = `${N.toLocaleString()} prims`;
    loaded++;
    status.textContent = `Loaded ${loaded}/4`;
    if (loaded === 4) {
      resetView();
      status.textContent = 'Loaded — drag to rotate, scroll to zoom (synced)';
      setTimeout(() => status.style.opacity = 0.3, 3000);
    }
  }, undefined, (err) => {
    infos[i].textContent = `LOAD ERROR`;
    console.error('PLY load error', cond.url, err);
  });
});

function resetView() {
  const R = sharedRadius || 10;
  views.forEach(v => {
    v.camera.position.set(R * 1.2, R * 1.2, R * 1.2);
    v.camera.up.set(0, 0, 1);
    v.controls.target.set(0, 0, 0);
    v.controls.update();
  });
}

let syncing = false;
views.forEach((v, i) => {
  v.controls.addEventListener('change', () => {
    if (syncing || !document.getElementById('sync').checked) return;
    syncing = true;
    views.forEach((w, j) => {
      if (j === i) return;
      w.camera.position.copy(v.camera.position);
      w.camera.up.copy(v.camera.up);
      w.camera.quaternion.copy(v.camera.quaternion);
      w.controls.target.copy(v.controls.target);
      w.controls.update();
    });
    syncing = false;
  });
});

document.getElementById('ptsize').addEventListener('input', (e) => {
  const s = parseFloat(e.target.value);
  views.forEach(v => { if (v.points) v.points.material.size = s; });
});
document.getElementById('attn').addEventListener('change', (e) => {
  const a = e.target.checked;
  views.forEach(v => {
    if (v.points) {
      v.points.material.sizeAttenuation = a;
      v.points.material.needsUpdate = true;
    }
  });
});
document.getElementById('reset').addEventListener('click', resetView);

function animate() {
  requestAnimationFrame(animate);
  views.forEach(v => {
    const w = v.canvas.clientWidth;
    const h = v.canvas.clientHeight;
    if (v.canvas.width !== w || v.canvas.height !== h) {
      v.renderer.setSize(w, h, false);
      v.camera.aspect = w / h;
      v.camera.updateProjectionMatrix();
    }
    v.renderer.render(v.scene, v.camera);
  });
}
animate();
</script>
</body>
</html>
