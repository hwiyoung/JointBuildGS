<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>ARRGS 뷰어 v1 — 평면 배열+점유 공동최적화 (NOT OFFICIAL)</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font: 13px/1.45 system-ui, sans-serif; background:#14161a; color:#dde3ea; display:flex; height:100vh; }
  #side { width: 250px; background:#1b1e24; padding:10px; overflow-y:auto; flex-shrink:0; border-right:1px solid #2a2f38; }
  #side h1 { font-size:14px; margin:0 0 8px; color:#8ecbff; }
  #side .note { color:#7a8494; font-size:11px; margin-bottom:8px; }
  .runbtn { display:block; width:100%; text-align:left; margin:2px 0; padding:5px 7px; background:#232833; color:#cfd8e3; border:1px solid #2e3542; border-radius:5px; cursor:pointer; font-size:12px; }
  .runbtn.active { background:#2e4a6b; border-color:#4a7fb5; color:#fff; }
  .runbtn .exp { color:#8ecbff; font-weight:600; margin-right:5px; }
  #main { flex:1; display:flex; flex-direction:column; min-width:0; }
  #tabs { display:flex; gap:4px; padding:8px 10px 0; background:#1b1e24; }
  #tabs button { padding:6px 14px; background:#232833; color:#cfd8e3; border:1px solid #2e3542; border-bottom:none; border-radius:6px 6px 0 0; cursor:pointer; }
  #tabs button.active { background:#14161a; color:#8ecbff; font-weight:600; }
  #content { flex:1; display:flex; min-height:0; }
  #view3d { flex:1; position:relative; min-width:0; }
  #view3d canvas { display:block; }
  #panel { width: 380px; flex-shrink:0; background:#191c22; border-left:1px solid #2a2f38; overflow-y:auto; padding:10px; }
  #panel h2 { font-size:13px; color:#8ecbff; margin:10px 0 4px; }
  table { border-collapse: collapse; width:100%; font-size:11.5px; }
  th, td { border:1px solid #2e3542; padding:3px 5px; text-align:right; }
  th { background:#232833; color:#9fb4cc; }
  td.l, th.l { text-align:left; }
  .good { color:#7ee787; } .bad { color:#ff7b72; } .warn { color:#ffd866; }
  #timeline { padding:6px 10px; background:#1b1e24; border-top:1px solid #2a2f38; display:none; align-items:center; gap:10px; }
  #timeline input { flex: 1; }
  #snapimgs img { width:100%; margin:3px 0; border:1px solid #2e3542; border-radius:4px; }
  canvas.chart { width:100%; height:120px; background:#12141a; border:1px solid #2e3542; border-radius:4px; }
  .legend { font-size:11px; color:#9fb4cc; margin:4px 0; }
  .legend span { display:inline-block; padding:1px 7px; border-radius:3px; margin-right:4px; }
  #quantwrap { flex:1; overflow:auto; padding:12px; display:none; }
  select, button.small { background:#232833; color:#cfd8e3; border:1px solid #2e3542; border-radius:4px; padding:3px 6px; font-size:12px; }
  #hud { position:absolute; top:8px; left:10px; font-size:11px; color:#9fb4cc; background:#14161acc; padding:4px 8px; border-radius:5px; pointer-events:none; }
</style>
</head>
<body>
  <div id="side">
    <h1>ARRGS v1 — 8884</h1>
    <div class="note">평면 배열+점유 공동최적화 · NOT OFFICIAL · scientific_verdict: null</div>
    <div id="runs"></div>
  </div>
  <div id="main">
    <div id="tabs">
      <button data-tab="s1">S1 후보</button>
      <button data-tab="s2">S2 배열</button>
      <button data-tab="s34">S3+4 최적화</button>
      <button data-tab="s5" class="active">S5 산출</button>
      <button data-tab="quant">정량</button>
    </div>
    <div id="content">
      <div id="view3d"><div id="hud"></div></div>
      <div id="panel"></div>
      <div id="quantwrap"></div>
    </div>
    <div id="timeline">
      <span id="tl-label" style="min-width:120px"></span>
      <input type="range" id="tl-slider" min="0" max="0" value="0">
      <button class="small" id="tl-play">▶</button>
    </div>
  </div>
<script type="module" src="./app.js"></script>
</body>
</html>
