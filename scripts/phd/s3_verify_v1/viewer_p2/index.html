<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>S3 검증 페이지 2 — 배열·초기값 S2 (NOT OFFICIAL)</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font: 13px/1.45 system-ui, sans-serif; background:#14161a; color:#dde3ea;
         display:flex; flex-direction:column; height:100vh; }
  #top { display:flex; align-items:center; gap:14px; padding:8px 12px; background:#1b1e24;
         border-bottom:1px solid #2a2f38; flex-shrink:0; }
  #top h1 { font-size:14px; margin:0; color:#8ecbff; font-weight:600; }
  .badge { display:inline-block; padding:1px 7px; border-radius:4px; font-size:10.5px; font-weight:600;
           vertical-align:middle; }
  .badge.no { background:#4a1f22; color:#ff9b93; border:1px solid #7a3238; }
  .badge.prop { background:#4a3d10; color:#ffd866; border:1px solid #7a6a2a; }
  .badge.eval { background:#173a2a; color:#7ee787; border:1px solid #2a6a45; }
  .badge.good { background:#173a2a; color:#7ee787; border:1px solid #2a6a45; }
  .badge.bad { background:#4a1f22; color:#ff7b72; border:1px solid #7a3238; }
  .badge.na { background:#232833; color:#9fb4cc; border:1px solid #2e3542; }
  #top .note, .note { color:#7a8494; font-size:11px; }
  #runbox { margin-left:auto; font-size:12px; color:#9fb4cc; }
  select, button.small, input[type=text] { background:#232833; color:#cfd8e3; border:1px solid #2e3542;
           border-radius:4px; padding:3px 6px; font-size:12px; }
  button.small { cursor:pointer; }
  button.small:disabled { opacity:0.45; cursor:default; }
  input[type=range] { accent-color:#4a9eff; height:22px; margin:0; }
  #checkstrip { flex-shrink:0; background:#181b21; border-bottom:1px solid #2a2f38; padding:6px 12px;
                font-size:11.5px; }
  #checkstrip .chkrow { display:flex; flex-wrap:wrap; gap:6px 14px; margin-bottom:4px; }
  #checkstrip .chkitem { color:#cfd8e3; }
  #checkstrip .chkitem b { color:#8ecbff; }
  #checkstrip .meta { color:#9fb4cc; }
  #content { flex:1; display:flex; min-height:0; }
  #view3d { flex:1; position:relative; min-width:0; }
  #view3d canvas { display:block; }
  #hud { position:absolute; top:8px; left:10px; font-size:11px; color:#9fb4cc; background:#14161acc;
         padding:4px 8px; border-radius:5px; pointer-events:none; max-width:60%; }
  #selbadge { position:absolute; bottom:10px; left:10px; font-size:11.5px; color:#dde3ea;
              background:#14161add; border:1px solid #7a6a2a; padding:4px 9px; border-radius:5px;
              pointer-events:none; max-width:70%; }
  .caption { border-left:3px solid #4a9eff; background:#1b1f27; padding:4px 8px;
             border-radius:0 4px 4px 0; margin-bottom:8px; }
  #panel { width: 420px; flex-shrink:0; background:#191c22; border-left:1px solid #2a2f38;
           overflow-y:auto; padding:10px; }
  #panel h2 { font-size:13px; color:#8ecbff; margin:12px 0 4px; }
  #panel h2:first-child { margin-top:0; }
  table { border-collapse: collapse; width:100%; font-size:11.5px; }
  th, td { border:1px solid #2e3542; padding:3px 5px; text-align:right; }
  th { background:#232833; color:#9fb4cc; }
  td.l, th.l { text-align:left; }
  .good { color:#7ee787; } .bad { color:#ff7b72; } .warn { color:#ffd866; }
  .flipnew { color:#ff9a3c; } .flipgone { color:#2ee6c8; }
  .legend { font-size:11px; color:#9fb4cc; margin:4px 0; }
  .legend label { margin-right:8px; cursor:pointer; }
  .card { border:1px solid #2e3542; border-radius:5px; padding:6px 8px; margin:6px 0;
          background:#1b1f27; font-size:11.5px; }
  .err { color:#ff7b72; font-size:11px; border:1px solid #663333; border-radius:4px;
         padding:4px 6px; margin:4px 0; }
  textarea { width:100%; background:#12141a; color:#dde3ea; border:1px solid #2e3542;
             border-radius:4px; font: 12px/1.4 system-ui, sans-serif; padding:5px; resize:vertical; }
  tr[data-cid], tr[data-fid], tr[data-pid] { cursor:pointer; }
  tr[data-cid].sel, tr[data-fid].sel, tr[data-pid].sel { background:#4a3d10; }
  .pchip { display:inline-block; border:1px solid #2e3542; border-radius:4px; padding:0 6px;
           margin:1px 3px 1px 0; font-size:11px; cursor:pointer; text-decoration:none;
           background:#1b1f27; }
  .pchip:hover { background:#232833; }
  /* ⑦ 스타일 견본 색칩 — 후보 평면(채움+테두리) vs 생성된 면(윤곽선만) 두 줄 범례 */
  .stylechip { display:inline-block; width:14px; height:10px; border:2px solid #888;
               border-radius:2px; vertical-align:middle; margin-right:5px; }
  .scrollbox { max-height:260px; overflow-y:auto; border:1px solid #2e3542; border-radius:4px; }
  .scrollbox table { width:100%; } .scrollbox th { position:sticky; top:0; }
</style>
</head>
<body>
  <header id="top">
    <div>
      <h1>S3 검증 · 페이지 2 — 배열·초기값(S2)
        <span class="badge no">NOT OFFICIAL · scientific_verdict: null</span></h1>
      <div class="note" id="countsline">번들 로딩 중…</div>
    </div>
    <div id="runbox">런 <select id="runsel"></select></div>
  </header>
  <div id="checkstrip">판독 체크리스트 로딩 중…</div>
  <div id="content">
    <div id="view3d"><div id="hud"></div><div id="selbadge" style="display:none"></div></div>
    <div id="panel"><p class="note">런을 선택하세요.</p></div>
  </div>
<script type="module" src="./app.js"></script>
</body>
</html>
