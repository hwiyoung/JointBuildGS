<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Noto Sans CJK KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="13" fill="#1a202c">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1a202c"/></marker><marker id="arrb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2b6cb0"/></marker></defs>
<rect width="960" height="470" fill="#ffffff"/>
<text x="40" y="28" font-size="15" font-weight="bold">(a) 광선 검사: 지금 카메라의 시선이 옛 표면 자리에서 무엇을 만나나</text><polygon points="98,52 122,52 110,70" fill="#1a202c"/><text x="60" y="52" >카메라(2024)</text><line x1="40" y1="300" x2="460" y2="300" stroke="#dd6b20" stroke-width="2.5"/><line x1="150" y1="200" x2="250" y2="200" stroke="#2b6cb0" stroke-width="3" stroke-dasharray="7 4"/><line x1="270" y1="300" x2="270" y2="190" stroke="#718096"/><line x1="330" y1="300" x2="330" y2="190" stroke="#718096"/><line x1="270" y1="190" x2="330" y2="190" stroke="#dd6b20" stroke-width="3"/><line x1="270" y1="190" x2="330" y2="190" stroke="#2b6cb0" stroke-width="1.5" stroke-dasharray="7 4"/><line x1="350" y1="300" x2="350" y2="180" stroke="#718096"/><line x1="410" y1="300" x2="410" y2="180" stroke="#718096"/><line x1="350" y1="180" x2="410" y2="180" stroke="#dd6b20" stroke-width="3"/><line x1="350" y1="195" x2="410" y2="195" stroke="#2b6cb0" stroke-width="3" stroke-dasharray="7 4"/><ellipse cx="440" cy="235" rx="22" ry="18" fill="#dd6b20" fill-opacity="0.25" stroke="#dd6b20" stroke-dasharray="3 2"/><line x1="110" y1="70" x2="200" y2="300" stroke="#1a202c" stroke-width="1.5" marker-end="url(#arr)"/><circle cx="161" cy="200" r="4" fill="none" stroke="#2b6cb0" stroke-width="2"/><line x1="110" y1="70" x2="300" y2="190" stroke="#1a202c" stroke-width="1.5" marker-end="url(#arr)"/><line x1="110" y1="70" x2="380" y2="180" stroke="#1a202c" stroke-width="1.5" marker-end="url(#arr)"/><line x1="110" y1="70" x2="440" y2="225" stroke="#1a202c" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/><text x="150" y="330" font-size="12">관통: 옛 지붕 자리를 뚫고</text><text x="150" y="345" font-size="12">땅에 닿음 → 옛 것 없음</text><text x="262" y="170" font-size="12">일치</text><text x="352" y="168" font-size="12">차단: 새 표면이 앞을 막음</text><text x="352" y="152" font-size="11" fill="#718096">(출현 또는 새 점군의 편향)</text><text x="400" y="260" font-size="12">무착지: 못 봄</text><text x="40" y="380" font-size="12">광선은 '옛 표면 자리에 지금 무엇이 있나'를 말한다. 차단과 얕은 관통은 새 점군이 틀린 경우와</text><text x="40" y="396" font-size="12">닮으므로 광선만으로 결정하지 않는다. 사진이 가른다.</text><text x="500" y="28" font-size="15" font-weight="bold">(b) 사진 맞춤 검사: 후보 표면으로 사진 A 의 조각을 사진 B 로 옮겨 본다</text><polygon points="548,52 572,52 560,70" fill="#1a202c"/><text x="538" y="46" >사진 A</text><polygon points="868,52 892,52 880,70" fill="#1a202c"/><text x="858" y="46" >사진 B</text><line x1="520" y1="270" x2="920" y2="270" stroke="#dd6b20" stroke-width="3"/><text x="522" y="290" fill="#dd6b20" font-size="12">새 표면(진짜 표면이라 하자)</text><line x1="560" y1="200" x2="880" y2="200" stroke="#2b6cb0" stroke-width="3" stroke-dasharray="7 4"/><text x="562" y="192" fill="#2b6cb0" font-size="12">옛 표면(후보)</text><line x1="540" y1="264" x2="548" y2="270" stroke="#dd6b20" stroke-width="1"/><line x1="560" y1="264" x2="568" y2="270" stroke="#dd6b20" stroke-width="1"/><line x1="580" y1="264" x2="588" y2="270" stroke="#dd6b20" stroke-width="1"/><line x1="600" y1="264" x2="608" y2="270" stroke="#dd6b20" stroke-width="1"/><line x1="620" y1="264" x2="628" y2="270" stroke="#dd6b20" stroke-width="1"/><line x1="640" y1="264" x2="648" y2="270" stroke="#dd6b20" stroke-width="1"/><line x1="660" y1="264" x2="668" y2="270" stroke="#dd6b20" stroke-width="1"/><line x1="680" y1="264" x2="688" y2="270" stroke="#dd6b20" stroke-width="1"/><line x1="700" y1="264" x2="708" y2="270" stroke="#dd6b20" stroke-width="1"/><line x1="720" y1="264" x2="728" y2="270" stroke="#dd6b20" stroke-width="1"/><line x1="740" y1="264" x2="748" y2="270" stroke="#dd6b20" stroke-width="1"/><line x1="760" y1="264" x2="768" y2="270" stroke="#dd6b20" stroke-width="1"/><line x1="780" y1="264" x2="788" y2="270" stroke="#dd6b20" stroke-width="1"/><line x1="800" y1="264" x2="808" y2="270" stroke="#dd6b20" stroke-width="1"/><line x1="820" y1="264" x2="828" y2="270" stroke="#dd6b20" stroke-width="1"/><line x1="840" y1="264" x2="848" y2="270" stroke="#dd6b20" stroke-width="1"/><line x1="860" y1="264" x2="868" y2="270" stroke="#dd6b20" stroke-width="1"/><line x1="880" y1="264" x2="888" y2="270" stroke="#dd6b20" stroke-width="1"/><line x1="900" y1="264" x2="908" y2="270" stroke="#dd6b20" stroke-width="1"/><circle cx="720" cy="270" r="4" fill="#dd6b20"/><line x1="560" y1="70" x2="720" y2="270" stroke="#dd6b20" stroke-width="1.5"/><line x1="880" y1="70" x2="720" y2="270" stroke="#dd6b20" stroke-width="1.5"/><circle cx="720" cy="200" r="4" fill="none" stroke="#2b6cb0" stroke-width="2"/><line x1="560" y1="70" x2="806" y2="270" stroke="#2b6cb0" stroke-width="1.5" stroke-dasharray="5 3"/><line x1="880" y1="70" x2="634" y2="270" stroke="#2b6cb0" stroke-width="1.5" stroke-dasharray="5 3"/><circle cx="806" cy="270" r="4" fill="#2b6cb0"/><circle cx="634" cy="270" r="4" fill="#2b6cb0"/><text x="500" y="330" font-size="12">새 표면 가정(주황): 같은 3D 점을 A 와 B 가 같은 지붕 조각으로 봄 → 무늬 일치, 상관 높음</text><text x="500" y="348" font-size="12">옛 표면 가정(파랑): A 와 B 가 실제로는 서로 다른 곳을 봄 → 무늬 어긋남, 상관 낮음</text><text x="500" y="380" font-size="12">같은 사진 쌍에서 두 후보의 상관값을 비교한다. 여러 쌍의 중앙값과 이긴 쌍의 비율이 '누가 맞나'다.</text><text x="500" y="396" font-size="12">조건: 무늬가 있을 것, 두 사진이 그 자리를 볼 것, 쌍의 각도가 판별 대역 안일 것. 아니면 '모름'.</text><text x="40" y="440" font-size="13" font-weight="bold">결과 셋: 옛 것 맞음 / 새 것 맞음 / 모름(못 봄, 못 가름). 맞는 쪽을 정밀도만큼 믿는다. 정밀도는 유효성이 정해진 뒤에만 쓴다.</text></svg>