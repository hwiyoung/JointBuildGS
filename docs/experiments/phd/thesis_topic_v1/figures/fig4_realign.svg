rl(#arrb)"/><line x1="160" y1="138" x2="160" y2="158" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#arrb)"/><line x1="200" y1="138" x2="200" y2="158" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#arrb)"/><line x1="240" y1="138" x2="240" y2="158" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#arrb)"/><line x1="280" y1="138" x2="280" y2="158" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#arrb)"/><line x1="320" y1="138" x2="320" y2="158" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#arrb)"/><line x1="360" y1="228" x2="360" y2="248" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#arrb)"/><line x1="400" y1="228" x2="400" y2="248" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#arrb)"/><text x="40" y="290" font-size="12">모든 셀의 차이가 같은 값(분산 작음, 부호 같음)</text><text x="40" y="306" font-size="12">→ 변화가 아니라 밀림 → 그만큼 다시 옮기고 검사를 한 번 더</text><text x="500" y="60" font-weight="bold">(b) 진짜 변화</text><line x1="520" y1="80" x2="520" y2="250" stroke="#e2e8f0"/><line x1="540" y1="80" x2="540" y2="250" stroke="#e2e8f0"/><line x1="560" y1="80" x2="560" y2="250" stroke="#e2e8f0"/><line x1="580" y1="80" x2="580" y2="250" stroke="#e2e8f0"/><line x1="600" y1="80" x2="600" y2="250" stroke="#e2e8f0"/><line x1="620" y1="80" x2="620" y2="250" stroke="#e2e8f0"/><line x1="640" y1="80" x2="640" y2="250" stroke="#e2e8f0"/><line x1="660" y1="80" x2="660" y2="250" stroke="#e2e8f0"/><line x1="680" y1="80" x2="680" y2="250" stroke="#e2e8f0"/><line x1="700" y1="80" x2="700" y2="250" stroke="#e2e8f0"/><line x1="720" y1="80" x2="720" y2="250" stroke="#e2e8f0"/><line x1="740" y1="80" x2="740" y2="250" stroke="#e2e8f0"/><line x1="760" y1="80" x2="760" y2="250" stroke="#e2e8f0"/><line x1="780" y1="80" x2="780" y2="250" stroke="#e2e8f0"/><line x1="800" y1="80" x2="800" y2="250" stroke="#e2e8f0"/><line x1="820" y1="80" x2="820" y2="250" stroke="#e2e8f0"/><line x1="840" y1="80" x2="840" y2="250" stroke="#e2e8f0"/><line x1="860" y1="80" x2="860" y2="250" stroke="#e2e8f0"/>