  <text class="h" x="40" y="36">수동판정 44동 — 라벨 분포</text>
  <text class="s" x="40" y="56">주 라벨(코드북 9라벨 중 4종 사용) · 불명 0</text>

  <!-- 좌: 라벨 분포, 16px/동 -->
