  <rect x="175" y="88" width="272" height="26" fill="#5b84b1" rx="4"/><text class="n" x="455" y="107" fill="#1a2733">17</text>
  <text class="l" x="40" y="148">가림</text>
  <rect x="175" y="132" width="176" height="26" fill="#c98a5e" rx="4"/><text class="n" x="359" y="151" fill="#1a2733">11</text>
  <text class="l" x="40" y="192">복합(2성분)</text>
  <rect x="175" y="176" width="192" height="26" fill="#9aa8b5" rx="4"/><text class="n" x="375" y="195" fill="#1a2733">12</text>
  <text class="s" x="175" y="220">성분: 소형 8 · 가림 7 · 재질 5 · 관측 2 · 저조도 1 · 세장 1</text>
  <text class="l" x="40" y="254">무텍스처</text>
  <rect x="175" y="238" width="64" height="26" fill="#8a7fb1" rx="4"/><text class="n" x="247" y="257" fill="#1a2733">4</text>

  <!-- 우: 성분 집계, 16px/회 -->
  <text class="h" x="530" y="36">원인 성분으로 풀면 — 56회 출현</text>
  <text class="s" x="530" y="56">진한 = 단독 라벨 · 연한 = 복합 속 성분</text>

  <text class="l" x="530" y="104">관측기하</text>
  <rect x="640" y="88" width="272" height="26" fill="#5b84b1" rx="4"/><rect x="912" y="88" width="32" height="26" fill="#a8c0d8"/>
