  <rect x="40" y="300" width="900" height="106" fill="#fffbe6" stroke="#e6d780" rx="8"/>
  <text class="l" x="60" y="328"><tspan font-weight="bold">읽는 법:</tspan> 관측기하 19 = 취득 설계의 공백(재촬영 회복 부류) · 가림 18 = 도시 형태의 구조적 한계(ALS도 구멍)</text>
  <text class="l" x="60" y="354">재질 10 = 관측 최상에서도 실패(순수 표면 형성 실패 — 회귀·② 개입의 표적) · 소형 8 = LoD2 분할 산물(부속 가지)</text>
  <text class="s" x="60" y="384">주의: ALS 상한은 별도 완전측량 캠페인 — 동시취득 드론 LiDAR도 같은 동을 놓침(W4d 41/46 캠페인 귀속) → 격차는 모달리티 아닌 취득 설계.</text>
  <text class="cap" x="40" y="440">판정=김휘영 · 2026-07-04 · 근거 CSV=docs/manual_review_judgments.csv · 확증은 §3.2 회귀·E5에서</text>
