purpose: put the two rules the r9 review fixed into the code - when the re-read of the Gaussian judgment and the opacity reset fall on one iteration the re-read comes first and the reset reads the protection it has just set (already r9's order; recorded, no code change); the part of an LoD2 wall that overlaps a wall of another building is left out of the prior surface - and make three checks - the mesh check of invisible faces in two layers (mechanism / product), the initial direction of airborne LiDAR prior Gaussians by two methods (vertex / cell), and whether r9's worse ground-truth column of case 3 in airborne LiDAR nominal is spread or the share of the initial-direction fix. No claim about the method's effect; no baseline, no multi-building evaluation.
