  crosscheck_199.csv: journal1 change tiers / AX-10 user labels vs this survey
  regions.json / region_views.json: R1-R5 and B0 cards (geometry, buildings, densities, vintages, views)
  targets_views.json / image_tilts.json / crops/: view counts and photo crops
  rows/ rows_final/ figures/: figure rows and pages
  qa/: quick-look, horizontal-shift probe, B0 GT identity, masked removals, candidate multi-return
  receipt_task.json: commit, Docker image id, script/config hashes, input hashes, step seconds
